# The kind smoke test's stand-ins (namespace stubs): the Pub/Sub emulator, a stub Supabase, and the job that makes
# the topic and the pulled subscriptions. The scripts come from the smoke ConfigMap (smoke.sh creates it).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pubsub-emulator
  namespace: stubs
spec:
  replicas: 1
  selector:
    matchLabels: { app: pubsub-emulator }
  template:
    metadata:
      labels: { app: pubsub-emulator }
    spec:
      containers:
        - name: emulator
          image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
          command: ["gcloud", "beta", "emulators", "pubsub", "start", "--host-port=0.0.0.0:8085", "--project=local"]
          ports:
            - containerPort: 8085
          readinessProbe:
            tcpSocket: { port: 8085 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pubsub-emulator
  namespace: stubs
spec:
  selector: { app: pubsub-emulator }
  ports:
    - port: 8085
      targetPort: 8085
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-stub
  namespace: stubs
spec:
  replicas: 1
  selector:
    matchLabels: { app: supabase-stub }
  template:
    metadata:
      labels: { app: supabase-stub }
    spec:
      containers:
        - name: stub
          image: python:3.13-slim
          command: ["python", "-u", "/smoke/supabase_stub.py"]
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 5
          volumeMounts:
            - { name: smoke, mountPath: /smoke }
      volumes:
        - name: smoke
          configMap: { name: smoke }
---
apiVersion: v1
kind: Service
metadata:
  name: supabase-stub
  namespace: stubs
spec:
  selector: { app: supabase-stub }
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pubsub-init
  namespace: stubs
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: six-sevens/backend:kind
          imagePullPolicy: Never
          command: ["python", "-m", "app.events.emulator_setup"]
          env:
            - { name: PUBSUB_EMULATOR_HOST, value: "pubsub-emulator.stubs.svc.cluster.local:8085" }
            - { name: GOOGLE_CLOUD_PROJECT, value: local }
            - { name: EVENT_DELIVERY, value: pull }
