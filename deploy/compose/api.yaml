services:
  api:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: api
    image: six-sevens/api:local
    env_file:
      - path: ../../backend/.env
        required: false
    environment:
      EVENT_TRANSPORT: pubsub
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GOOGLE_CLOUD_PROJECT: local
      CORS_IN_APP: "false"
      OTEL_SERVICE_NAME: api
    depends_on:
      pubsub-init:
        condition: service_completed_successfully
