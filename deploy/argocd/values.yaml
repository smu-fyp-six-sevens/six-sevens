# Argo CD, the smallest install that watches one chart (deploy/terraform/README.md, "Argo CD"). About 0.85 vCPU and
# 1.4 GiB requested in all.
#
# Explicit requests throughout: on Autopilot a container without them is given 0.5 vCPU and 2 GiB.

dex:
  enabled: false            # no SSO: the admin login, behind a port-forward
notifications:
  enabled: false
applicationSet:
  enabled: false            # one Application, written by hand (application.yaml)

configs:
  params:
    server.insecure: true   # reached only through kubectl port-forward, never exposed
  cm:
    timeout.reconciliation: 180s
    # An annotation, not a label: Cloud Deploy's objects carry no Argo CD label, and labels can reach selectors.
    application.resourceTrackingMethod: annotation

controller:
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 250m, memory: 512Mi }

repoServer:
  resources:
    requests: { cpu: 250m, memory: 384Mi }
    limits: { cpu: 250m, memory: 384Mi }

server:
  service:
    type: ClusterIP
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { cpu: 100m, memory: 192Mi }

redis:
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: 250m, memory: 256Mi }
