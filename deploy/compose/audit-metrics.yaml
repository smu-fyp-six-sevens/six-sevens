services:
  audit-metrics:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: audit-metrics
    image: six-sevens/audit-metrics:local
    env_file:
      - path: ../../backend/.env
        required: false
    environment:
      EVENT_TRANSPORT: pubsub
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GOOGLE_CLOUD_PROJECT: local
      CORS_IN_APP: "false"
      OTEL_SERVICE_NAME: audit-metrics
      EVENT_DELIVERY: ${EVENT_DELIVERY:-push}
      # Pull mode only: storing an event is quick, so take many at once (its concurrency on Cloud Run).
      PULL_MAX_MESSAGES: "40"
    depends_on:
      pubsub-init:
        condition: service_completed_successfully
