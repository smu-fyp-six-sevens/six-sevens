name: CI/CD

on:
  push:
    branches:
      - main
    # A push of only docs, workflow files or .gitignore neither tests nor redeploys anything.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/**'
      - '.gitignore'
  # A PR of only docs, workflow files or .gitignore runs nothing either.
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces the run still going for the older one. Pushes to main are never
# cancelled: each one is a deploy, and the run name is unique per commit.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SECRET_KEY: placeholder-key
      SUPABASE_STORAGE_BUCKET: documents
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          # pip's download cache, reused until either file changes.
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.lock
            backend/pyproject.toml

      # Cached between runs, so apt-get update (the slow part) only runs when the cache is empty.
      - name: Install exiftool (the metadata and AI-provenance tests need it)
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: libimage-exiftool-perl
          version: 1.0

      - name: Check exiftool
        working-directory: .
        run: exiftool -ver

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          # The locked versions the image ships, plus the dev tools; then the app itself.
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Type check (pyright) - fails the build
        run: pyright app

      - name: Reject type-check suppressions and weakened pyright config
        run: |
          fail=0
          if grep -rnE "#\s*(type:\s*ignore|pyright:)" app --include=*.py; then
            echo "::error::'# type: ignore' and '# pyright:' comments are not allowed in app/. Fix the type."
            fail=1
          fi
          if [ -f pyrightconfig.json ]; then
            echo "::error::pyrightconfig.json would override [tool.pyright] in pyproject.toml; remove it."
            fail=1
          fi
          section="$(awk '/^\[tool\.pyright\]/{f=1;next} /^\[/{f=0} f' pyproject.toml)"
          if echo "$section" | grep -nE '^\s*(report[A-Za-z]+|ignore|exclude|strict)\s*=|enableTypeIgnoreComments\s*=\s*true|typeCheckingMode\s*=\s*"(off|basic)"'; then
            echo "::error::[tool.pyright] must not disable rules, exclude files, or relax the checking mode."
            fail=1
          fi
          if ! echo "$section" | grep -qE '^\s*include\s*=\s*\["app"\]'; then
            echo "::error::[tool.pyright] must set include = [\"app\"]."
            fail=1
          fi
          exit $fail

      # frontend/openapi.json is generated from the backend models; a model change must regenerate it.
      - name: Check openapi.json matches the backend
        run: python scripts/export_openapi.py --check

      - name: Run backend tests
        run: pytest --cov=app --cov-report=

      - name: Show coverage report (sorted by coverage, ascending)
        run: coverage report --show-missing --sort=cover

  frontend-ci:
    # Includes the SCRUM-206 Playwright regression suite (Sprint 1 & 2 test
    # cases against a mocked backend, frontend/e2e) — one job, one install,
    # instead of a second job repeating checkout/setup-node/npm ci.
    name: Frontend CI
    runs-on: ubuntu-latest
    # Chromium and its system libraries come with the image, so there is no browser install step. The tag must
    # match @playwright/test in frontend/package-lock.json; bump both together.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      # src/services/api.gen.ts is generated from openapi.json; never hand-edited.
      - name: Check api.gen.ts matches openapi.json
        run: npm run check:api

      # vite build doesn't type-check, so a type error would otherwise ship.
      - name: Type-check frontend
        run: npm run typecheck

      # The logic below the browser (hooks, approval rules, filters), in a simulated DOM (vitest, src/**/*.test.ts).
      - name: Run unit tests
        run: npm test

      - name: Run regression tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  security:
    # Blocking: a high-severity finding fails the build and stops the deploy. Findings that don't apply are
    # skipped inline with a reason (#checkov:skip=...), never by making this job optional.
    name: Security (Checkov, dependency audits, Snyk, Terraform)
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # The whole history, so the dependency check below can compare with the commit before this push.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          # pip's download cache for Checkov and pip-audit; the key is a file that changes when Checkov's range does.
          cache: pip
          cache-dependency-path: .github/workflows/ci-cd.yml

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # One step per scan, so findings in one don't stop the others from running.
      - name: Install Checkov
        run: python -m pip install "checkov>=3.2,<4"

      - name: Checkov (Terraform)
        if: ${{ !cancelled() }}
        run: checkov -d deploy/terraform --framework terraform --compact --quiet

      - name: Checkov (Dockerfiles)
        if: ${{ !cancelled() }}
        run: checkov --framework dockerfile -f backend/Dockerfile -f deploy/kong/Dockerfile -f deploy/grafana/Dockerfile -f frontend/Dockerfile --compact --quiet

      - name: Checkov (workflows)
        if: ${{ !cancelled() }}
        run: checkov -d .github/workflows --framework github_actions --compact --quiet

      # Every run: free scanners with no quota, blocking. pip-audit fails on any known vulnerability (OSV gives no
      # severity to filter on); npm audit on high and critical.
      - name: pip-audit (Python dependencies)
        if: ${{ !cancelled() }}
        run: |
          python -m pip install "pip-audit>=2.7,<3"
          pip-audit -r backend/requirements.lock --no-deps --disable-pip

      - name: npm audit (npm dependencies)
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm audit --audit-level=high

      # Secrets in the commits this push or pull request adds (not the whole history again: seconds, not minutes). The
      # binary in a pinned image: gitleaks-action needs a licence for organisation repositories.
      - name: gitleaks (secrets in new commits)
        if: ${{ !cancelled() }}
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$PUSH_BEFORE"
          [ "$EVENT" = "pull_request" ] && base="$PR_BASE"
          range="HEAD~1..HEAD"
          git cat-file -e "${base:-none}^{commit}" 2>/dev/null && range="$base..HEAD"
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            git /repo --config /repo/.gitleaks.toml --log-opts="$range" --redact --no-banner --exit-code 1

      # Snyk's free plan has a monthly test quota, so it runs only when the dependencies change, or by hand.
      - name: Did the dependencies change?
        id: deps
        if: ${{ !cancelled() }}
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$PUSH_BEFORE"
          [ "$EVENT" = "pull_request" ] && base="$PR_BASE"
          if [ "$EVENT" = "workflow_dispatch" ] \
            || ! git cat-file -e "${base:-none}^{commit}" 2>/dev/null \
            || ! git diff --quiet "$base" HEAD -- backend/requirements.lock frontend/package.json frontend/package-lock.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Dependencies unchanged: Snyk skipped (pip-audit and npm audit ran)."
          fi

      # Temporarily non-blocking (continue-on-error) while the monthly quota is used up; remove both
      # continue-on-error lines once it resets, so Snyk blocks again when it runs.
      - name: Snyk (Python dependencies)
        if: ${{ !cancelled() && steps.deps.outputs.changed == 'true' }}
        continue-on-error: true
        run: |
          # Snyk reads installed packages for a requirements file, so install them first.
          python -m pip install -r backend/requirements.lock
          npx --yes snyk@1 test --file=backend/requirements.lock --package-manager=pip --severity-threshold=high

      - name: Snyk (npm dependencies)
        if: ${{ !cancelled() && steps.deps.outputs.changed == 'true' }}
        continue-on-error: true
        run: cd frontend && npm ci && npx --yes snyk@1 test --severity-threshold=high

      # Terraform format and validity only: no state, no credentials. `apply` stays a manual step
      # (deploy/terraform/README.md). Here rather than in its own job, which billed a minute for seconds of work.
      - uses: hashicorp/setup-terraform@v3
        if: ${{ !cancelled() }}
        with:
          # The version `terraform apply` runs with locally; keep them the same.
          terraform_version: 1.16.6

      - name: terraform fmt
        if: ${{ !cancelled() }}
        working-directory: deploy/terraform
        run: terraform fmt -check -recursive

      - name: terraform validate
        if: ${{ !cancelled() }}
        working-directory: deploy/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      # The configuration nothing else runs before a deploy: Kong's routes, the compose files, the dashboards'
      # queries, and, on a pull request, the images themselves (a push to main builds them in deploy.yml).
      # Here rather than in a job of its own, which billed a minute for seconds of work.
      - name: Kong config parses
        if: ${{ !cancelled() }}
        run: |
          docker build -q -t kong-check -f deploy/kong/Dockerfile .
          docker run --rm -e KONG_CONFIG_CHECK_ONLY=1 -e API_URL=http://api:8000 -e AUDIT_URL=http://audit-metrics:8000 \
            -e CORS_ORIGINS=http://localhost:5173 -e GATEWAY_SECRET=ci-placeholder kong-check

      - name: Compose files are valid
        if: ${{ !cancelled() }}
        run: docker compose config -q && docker compose --profile frontend --profile observability config -q

      - name: Dashboard queries are valid PromQL
        if: ${{ !cancelled() }}
        run: |
          python3 deploy/grafana/check_promql.py > "$RUNNER_TEMP/dashboard-rules.yml"
          docker run --rm -v "$RUNNER_TEMP:/check:ro" --entrypoint promtool prom/prometheus:v3.1.0 \
            check rules /check/dashboard-rules.yml

      - name: Images build
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          docker build -q -f backend/Dockerfile --target api .
          docker build -q -f frontend/Dockerfile .
          docker build -q -f deploy/grafana/Dockerfile .

  deploy:
    # Continuous deployment: every push to main whose checks all pass goes to Cloud Run.
    name: Deploy to Cloud Run
    needs: [backend-ci, frontend-ci, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write # Workload Identity Federation, used inside deploy.yml
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
