    - data:
        code: "import json\nimport re\nimport unicodedata\n \n \n\n_NONCHARACTERS\
          \ = re.compile(\n    \"[\\uFDD0-\\uFDEF\\uFFFE\\uFFFF]\"\n)\n \n# Other\
          \ stray control characters worth stripping (keep \\n, \\t)\n_CONTROL_CHARS\
          \ = re.compile(r\"[\\x00-\\x08\\x0B\\x0C\\x0E-\\x1F\\x7F]\")\n \n \ndef\
          \ sanitize_text(raw: str, *, collapse_to_single_line: bool = True) -> str:\n\
          \    \"\"\"\n    raw: the extracted text, however mangled.\n    collapse_to_single_line:\
          \ if True, all line breaks become single spaces\n        instead of \\n\
          \ (use this if you genuinely want one continuous line;\n        default\
          \ False just normalizes line endings, which is usually more\n        useful\
          \ for field-by-field extraction downstream).\n    \"\"\"\n    text = raw\n\
          \n    if \"\\\\r\\\\n\" in text or \"\\\\n\" in text:\n        text = text.replace(\"\
          \\\\r\\\\n\", \"\\n\").replace(\"\\\\r\", \"\\n\").replace(\"\\\\n\", \"\
          \\n\")\n\n    text = text.replace(\"\\r\\n\", \"\\n\").replace(\"\\r\",\
          \ \"\\n\")\n\n    text = _NONCHARACTERS.sub(\"\", text)\n    text = _CONTROL_CHARS.sub(\"\
          \", text)\n\n    text = unicodedata.normalize(\"NFKC\", text)\n\n    # ---\
          \ Neutralize characters that are structurally significant to JSON\n    #\
          \ and to this pipeline's own template interpolation ({{#node.var#}}).\n\
          \    # This pipeline builds JSON-shaped payloads via string interpolation\n\
          \    # rather than proper JSON-safe escaping in several places, so a\n \
          \   # literal one of these characters occurring naturally in the SOURCE\n\
          \    # document (a quoted phrase, a stray backslash, a bracketed note) can\n\
          \    # corrupt whatever JSON structure it lands inside further downstream\
          \ —\n    # this is what broke C028_CreditReport.pdf ('...refer to the \"\
          Credit\n    # Report Explanation\" section...'). Replaced rather than escaped:\
          \ an\n    # escape only survives one more interpolation layer before it\
          \ risks\n    # being double-escaped or stripped by whichever layer handles\
          \ it next.\n    text = text.replace('\"', \"'\")\n    text = text.replace(\"\
          \\\\\", \"/\")\n    text = text.replace(\"{\", \"(\").replace(\"}\", \"\
          )\")\n\n    if collapse_to_single_line:\n        text = re.sub(r\"\\s*\\\
          n\\s*\", \" \", text)\n        text = re.sub(r\" {2,}\", \" \", text)\n\
          \    else:\n        text = re.sub(r\"[ \\t]+\\n\", \"\\n\", text)\n    \
          \    text = re.sub(r\"\\n{3,}\", \"\\n\\n\", text)\n\n    return text.strip()\n\
          \ndef main(files, extracted_text) -> dict:\n    # filename: always available,\
          \ images included\n    name = \"\"\n    if files:\n        first = files[0]\n\
          \        if isinstance(first, dict):\n            name = first.get(\"filename\"\
          ) or first.get(\"name\") or \"\"\n        else:\n            name = str(first)\n\
          \n    # extracted_text arrives from the Variable Aggregator, so it is\n\
          \    # array[string] on the document branch and [\"\"] on the image branch.\n\
          \    # Tolerate None / str / empty list rather than indexing blindly.\n\
          \    if extracted_text is None:\n        raw = \"\"\n    elif isinstance(extracted_text,\
          \ list):\n        raw = \"\\n\".join(str(t) for t in extracted_text if t)\n\
          \    else:\n        raw = str(extracted_text)\n\n    text = sanitize_text(raw)\
          \ if raw.strip() else \"\"\n\n    # Signal for the agent: below MIN_USABLE_CHARS\
          \ the extraction is\n    # treated as failed. Catches both the image branch\
          \ (empty by\n    # construction) and scanned PDFs where the extractor returned\
          \ a\n    # handful of junk characters.\n    MIN_USABLE_CHARS = 50\n\n  \
          \  return {\n        \"filename\": str(name),\n        \"processed_extracted_text\"\
          : text,\n        \"has_text\": \"yes\" if len(text) >= MIN_USABLE_CHARS\
          \ else \"no\",\n        \"text_chars\": len(text),\n    }\n"
        code_language: python3
