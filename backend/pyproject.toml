[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fyp-backend"
version = "0.1.0"
description = "FastAPI backend for fyp"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]",
  "sqlalchemy>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "psycopg2-binary>=2.9,<3.0",
  "python-dotenv>=1.0,<2.0",
  "uvicorn[standard]>=0.27,<1.0",
  "supabase>=2.4",
  "pymupdf>=1.24,<2.0",
  "rapidocr>=3.0,<4.0",
  "onnxruntime>=1.20,<2.0",
  "pillow>=10.0,<12.0",
  "reportlab>=4.2,<5.0",
  "pypdf>=4.2,<5.0",
  "symspellpy>=6.7,<7.0",
  # Mock-document generators (doc_gen_scripts, scripts/generate_from_mastersheet.py),
  # exercised by tests/test_regression_document_generation.py. Already in
  # requirements.txt; CI installs from this file.
  "openpyxl>=3.1",
  "pandas>=2.1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "httpx2>=2.0,<3.0",
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=5.0,<7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Puts backend/ on sys.path so tests can import `app` and `scripts` whichever
# way pytest is launched (plain `pytest` in CI, `python -m pytest`, an IDE).
pythonpath = ["."]
# Regression suite tags (SCRUM-206): `pytest -m sprint1`, `pytest -m sprint2`.
# story(...) records the Jira story and the sprint test sheet's test case ID.
markers = [
  "sprint1: regression test for a Sprint 1 test case",
  "sprint2: regression test for a Sprint 2 test case",
  "story(jira_id, test_case_id): the Jira story and manual test case ID this test covers",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "def __repr__",
  "def __str__",
]
