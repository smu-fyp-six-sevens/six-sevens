    - data:
        code: "import json\n\n# Second-round (escalation) prompt only. The first-round\
          \ prompt is built in\n# the Code 3 node. On this branch the rule/LLM tools\
          \ have NOT been run yet, so\n# the agent calls them itself.\n\n_SHARED_BODY\
          \ = \"\"\"## Tools\n- classify_rule_based: regex over filename/text. Notes\
          \ include an address check.\n- class_llm: LLM reading extracted text.\n\
          - vision_llm: multimodal LLM reading the document image. Expensive — call\
          \ only when cheap tools can't settle it.\n\nEach tool returns up to 3 ranked\
          \ candidates + notes. confidence is RELATIVE (sums to 1 per tool, never\
          \ copy into output). match_strength is ABSOLUTE (0-1, use this for your\
          \ own confidence). A tool's \"pick\" = its rank-1. \"No match\" = empty\
          \ candidates or rank-1 match_strength < 0.3. \"Close\" = rank-1/rank-2 confidence\
          \ differ by < 0.15. A failed/unparseable tool is ABSENT — never count it\
          \ as agreeing or disagreeing.\n\n## Tool-calling\n`text_available` is given\
          \ below — follow it exactly, never guess.\n\n**yes:** Call classify_rule_based\
          \ + class_llm first. Then call vision_llm only if: (a) they disagree on\
          \ rank-1, (b) either gives no match/absent/close, (c) agreed type is nric/bank_statement\
          \ and Address check isn't \"visible\", or (d) agreed match_strength < 0.8.\
          \ Otherwise stop.\n\n**no:** Call vision_llm only — the text tools have\
          \ nothing to work on.\n\nNever call the same tool twice.\n\n## Categories\n\
          bank_statement, certificate_of_incorporation, payslip, passport, nric, fatca_crs_declaration,\
          \ certificate_of_incumbency, company_constitution, proof_of_address, source_of_wealth,\
          \ credit_report, list_of_loans, notice_of_assessment, other\n\n## bank_statement\
          \ vs source_of_wealth\n- bank_statement: a statement for a bank ACCOUNT\
          \ (current/savings/deposit) — account-level transaction history with balances,\
          \ credits and debits.\n- source_of_wealth: margin, securities, brokerage\
          \ or investment statements (holdings, positions, portfolio valuation), or\
          \ any financial document evidencing net worth or its history.\n- The issuer\
          \ does not decide it: a bank-issued securities/investment/wealth statement\
          \ is source_of_wealth, not bank_statement.\n- Mixed content → classify by\
          \ the primary content: deposit-account transactions → bank_statement; holdings/positions/net-worth\
          \ valuation → source_of_wealth.\n- If the tools split between these two,\
          \ apply this rule when judging which is strongest-supported, and name the\
          \ distinguishing feature in evidence.\n\n## passport vs nric\nBoth are identity\
          \ documents; never output \"id_document\".\n- nric: Singapore Identity Card.\
          \ Front: \"REPUBLIC OF SINGAPORE\", \"IDENTITY CARD NO.\", portrait, Race,\
          \ Sex, Country/Place of birth. Back: residential address block, fingerprint\
          \ area, Date of issue, usually no name or photo. Front and back are often\
          \ uploaded as separate files — classify each as nric, even when one side\
          \ alone looks sparse.\n- passport: biodata page with \"PASSPORT\" heading,\
          \ Type / Country Code / Passport No row, Nationality, Date of expiry, Authority,\
          \ and a two-line machine-readable zone (capitals, digits, \"<\" filler).\
          \ No residential address. It may print a \"National ID No\" in NRIC format\
          \ — that does not make it an nric.\n- Tie-breakers: \"IDENTITY CARD NO.\"\
          \ or an address block on a card layout -> nric. MRZ, \"Passport No\" or\
          \ Type/Country Code -> passport.\n- Identity document but genuinely can't\
          \ tell which: pick the likelier one, cap confidence at 0.6, set needs_manual_review,\
          \ and name the runner-up in evidence.\n\n\n## Deciding the type + confidence\n\
          Agreement = rank-1 picks matching, among tools that actually ran and returned\
          \ a result. A rank-2/3 match is partial support, not agreement.\n\n| Situation\
          \ | document_type | confidence |\n|---|---|---|\n| All 3 ran, all agree\
          \ | that type | avg match_strength, cap 0.95 |\n| All 3 ran, 2 agree | that\
          \ type | avg of the 2 agreeing, cap 0.85 |\n| All 3 ran, none agree | strongest-supported\
          \ (rank-1 > runner-up; higher match_strength wins) | its own match_strength,\
          \ cap 0.6 — set needs_manual_review |\n| All 3 ran, all no-match | \"other\"\
          \ | low — never high-confidence an absence |\n| 2 ran, agree | that type\
          \ | avg match_strength, cap 0.85 |\n| 2 ran, disagree | strongest-supported\
          \ | its own match_strength, cap 0.6 — set needs_manual_review |\n| Only\
          \ vision ran | its rank-1 | its match_strength, cap 0.8 (uncorroborated)\
          \ |\n| Only vision ran, no match | \"other\" | — set needs_manual_review\
          \ (weaker signal than 3-tool no-match) |\n| Only vision ran, failed | \"\
          other\" | — set needs_manual_review |\n\nIf the chosen type is \"close\"\
          \ in the tools that picked it: keep it, but set needs_manual_review true\
          \ and name the runner-up. If vision-only, say so explicitly in reasoning.\n\
          \nWhen needs_manual_review is true, state why: (a) not one of the LISTED\
          \ categories, (b) ambiguous between categories, or (c) vision-only and unresolved.\n\
          \n## Proof of address\nDepends on THIS document actually showing a legible\
          \ residential address — never inferred from type alone.\n- certificate_of_incumbency:\
          \ if it is a Singapore company, take note that the ACRA BizProfile also\
          \ covers this category.\n- nric: only satisfies it if a residential address\
          \ is visibly populated (not missing/cropped/illegible).\n- bank_statement:\
          \ only if the address is residential, not a registered office/business address.\n\
          - source_of_wealth: never adds proof_of_address, even if an address is shown.\n\
          - No confident confirmation → leave it out (under-claim, don't over-claim).\n\
          - Conflicting sources → \"not visible\" AND set needs_manual_review, name\
          \ the conflict.\n- Evidence sources: classify_rule_based's address note;\
          \ any tool's evidence at any rank. A proof_of_address candidate alone isn't\
          \ enough — needs actual address evidence.\n\nFor every nric/bank_statement,\
          \ add one evidence entry (counts toward the 4-entry max):\n`\"Address check:\
          \ visible — <location>\"` or `\"Address check: not visible — <why>\"`\n\n\
          This result is mechanical: \"visible\" → must include proof_of_address in\
          \ fulfilled_requirements; \"not visible\" → must not. Re-check before finalizing\
          \ — never contradict your own Address check line.\n\n## fulfilled_requirements\n\
          Default: exactly one entry — the document_type itself, except passport and\
          \ nric, which both use \"id_document\" (the case-checklist slot they fill).\
          \ Address check is the only thing that ever adds a second entry (proof_of_address),\
          \ and only for nric/bank_statement.\n\n## Evidence\nExplains why it's THIS\
          \ TYPE, never document content/values.\n- Name what's PRESENT, never its\
          \ VALUE (\"contains a TIN field\", not \"TIN 201812345A\").\n- Titles/headings\
          \ may be quoted verbatim (type signal, not a field value).\n- No names,\
          \ numbers, dates, amounts, addresses, identifiers.\n- Max 4 entries, one\
          \ line each. Restate tool evidence without values — never copy through verbatim.\n\
          \n## Output\nJSON only, nothing else:\n{\"document_type\": \"...\", \"confidence\"\
          : 0.0, \"evidence\": [\"...\"], \"reasoning\": \"...\", \"needs_manual_review\"\
          : true, \"fulfilled_requirements\": [\"...\"]}\"\"\"\n\n_INTRO = \"You classify\
          \ documents for a KYC/corporate onboarding pipeline.\\n\\n\"\n\n# Only these\
          \ two templates go through .format().\n_SECOND_ROUND_HEADER = \"\"\"This\
          \ document was already classified once as `{prior_document_type}`, but the\n\
          Extraction Agent — which reads the full document content in depth, not just\
          \ a\nquick pass — found this doesn't fit:\n\n  Reason: {reason}\n{suggestion_line}\
          \  Evidence Extraction actually found on the page:\n{evidence_lines}\n\n\
          This evidence came from a deeper read than your first pass. Treat it as\n\
          strong, not merely a suggestion to double-check. Only keep `{prior_document_type}`\n\
          if you have a concrete reason the Extraction finding doesn't actually\n\
          contradict it — state that reason explicitly. Do not keep the prior type\n\
          just because your original tool calls supported it; that support is exactly\n\
          what's being challenged here.\n\nThis is the only retry — after this classification,\
          \ no further escalation\nwill occur. If you are still genuinely unsure,\
          \ set needs_manual_review true\nper the normal rules rather than guessing.\n\
          \n\"\"\"\n\n_INPUTS_BLOCK = \"\"\"\n\n## Inputs for this document\n\ntext_available:\
          \ {text_available}\"\"\"\n\n# Keep in sync with MIN_USABLE_CHARS in the\
          \ Extract Filename node.\nMIN_USABLE_CHARS = 50\n\n\ndef _parse_escalation(value)\
          \ -> dict:\n    \"\"\"Dict or JSON string in; anything unusable becomes\
          \ {} (header falls back to defaults).\"\"\"\n    if isinstance(value, dict):\n\
          \        return value\n    if not value or not isinstance(value, str):\n\
          \        return {}\n\n    attempts = (\n        lambda: json.loads(value),\n\
          \        # Escaped inner JSON body ({\\\"reason\\\": ...}): decode as a\
          \ JSON string\n        # literal first, then as JSON.\n        lambda: json.loads(json.loads(f'\"\
          {value}\"')),\n    )\n    for attempt in attempts:\n        try:\n     \
          \       parsed = attempt()\n        except (ValueError, TypeError):\n  \
          \          continue\n        if isinstance(parsed, dict):\n            return\
          \ parsed\n    return {}\n\n\ndef _has_usable_text(extracted_text) -> bool:\n\
          \    if extracted_text is None:\n        return False\n    if isinstance(extracted_text,\
          \ list):\n        raw = \"\\n\".join(str(t) for t in extracted_text if t)\n\
          \    else:\n        raw = str(extracted_text)\n    return len(raw.strip())\
          \ >= MIN_USABLE_CHARS\n\n\ndef _build_header(data: dict) -> str:\n    evidence\
          \ = data.get(\"evidence\") or []\n    if isinstance(evidence, str):\n  \
          \      evidence = [evidence]\n    evidence_lines = \"\\n\".join(f\"    -\
          \ {item}\" for item in evidence)\n\n    suggested_type = data.get(\"suggested_document_type\"\
          )\n    suggestion_line = (\n        f\"  Extraction's own read suggests\
          \ this is actually a `{suggested_type}`.\\n\"\n        if suggested_type\n\
          \        else \"\"\n    )\n    return _SECOND_ROUND_HEADER.format(\n   \
          \     prior_document_type=data.get(\"prior_document_type\") or \"unknown\"\
          ,\n        reason=data.get(\"reason\") or \"(not provided)\",\n        suggestion_line=suggestion_line,\n\
          \        evidence_lines=evidence_lines,\n    )\n\n\ndef main(escalation_reason_json=None,\
          \ extracted_text=None) -> dict:\n    header = _build_header(_parse_escalation(escalation_reason_json))\n\
          \    inputs_block = _INPUTS_BLOCK.format(\n        text_available=\"yes\"\
          \ if _has_usable_text(extracted_text) else \"no\"\n    )\n    return {\"\
          prompt\": _INTRO + header + _SHARED_BODY + inputs_block}\n"
