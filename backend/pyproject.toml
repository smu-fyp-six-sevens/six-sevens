[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fyp-backend"
version = "0.1.0"
description = "FastAPI backend for fyp"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]",
  "sqlalchemy>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "psycopg2-binary>=2.9,<3.0",
  "python-dotenv>=1.0,<2.0",
  "uvicorn[standard]>=0.27,<1.0",
  "supabase>=2.4",
  "pymupdf>=1.24,<2.0",
  "rapidocr>=3.0,<4.0",
  "onnxruntime>=1.20,<2.0",
  "pillow>=10.0,<12.0",
  "reportlab>=4.2,<5.0",
  "pypdf>=4.2,<5.0",
  "symspellpy>=6.7,<7.0",
  "numpy",
  # LangGraph pipeline (backend/app/langgraph) — imported unconditionally by
  # main.py (via queue_service -> langgraph.pipeline -> langgraph.graph), so
  # this is a hard runtime dependency, not optional. Keep in sync with
  # requirements.txt.
  "langgraph>=0.2,<0.3",
  "langchain-anthropic>=0.3,<0.4",
  "langgraph-checkpoint-postgres>=2.0,<3.0",
  "psycopg[binary,pool]>=3.1,<4.0",
  # Observability (see app/telemetry.py) — also imported unconditionally by
  # main.py; off at runtime by default (OTEL_ENABLED), but still has to be
  # importable.
  "opentelemetry-api>=1.27,<2.0",
  "opentelemetry-sdk>=1.27,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-exporter-gcp-trace>=1.7,<2.0",
  # Mock-document generators (doc_gen_scripts). Already in requirements.txt;
  # CI installs from this file.
  "openpyxl>=3.1",
  "pandas>=2.1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "httpx2>=2.0,<3.0",
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=5.0,<7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Puts backend/ on sys.path so tests can import `app` and `scripts` whichever
# way pytest is launched (plain `pytest` in CI, `python -m pytest`, an IDE).
pythonpath = ["."]
# Regression suite tags (SCRUM-206): `pytest -m sprint1`, `pytest -m sprint2`.
# story(...) records the Jira story and the sprint test sheet's test case ID.
markers = [
  "sprint1: regression test for a Sprint 1 test case",
  "sprint2: regression test for a Sprint 2 test case",
  "story(jira_id, test_case_id): the Jira story and manual test case ID this test covers",
]
filterwarnings = [
  # langgraph-checkpoint's own internal import (JsonPlusSerializer) trips a
  # pending-deprecation warning about an `allowed_objects` default we never
  # pass ourselves — nothing in this codebase calls it, so there's no source
  # fix, only this filter. Revisit once Phase 4's checkpointer is actually
  # wired in (see LANGGRAPH_MIGRATION_PLAN.md).
  "ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pyright]
typeCheckingMode = "standard"

[tool.coverage.run]
omit = [
  # Dev-only synthetic fraud-injection tool, deliberately not unit-tested
  # (see tests/conftest.py's collect_ignore) — omit so it doesn't show as a
  # 0% coverage gap.
  "app/injection/*",
  "app/routers/injection.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "def __repr__",
  "def __str__",
]
