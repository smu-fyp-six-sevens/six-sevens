name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: placeholder-key
      SUPABASE_STORAGE_BUCKET: documents
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install exiftool (the metadata and AI-provenance tests need it)
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libimage-exiftool-perl
          exiftool -ver

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app

      - name: Type check (pyright) - fails the build
        run: pyright app

      - name: Reject type-check suppressions and weakened pyright config
        run: |
          fail=0
          if grep -rnE "#\s*(type:\s*ignore|pyright:)" app --include=*.py; then
            echo "::error::'# type: ignore' and '# pyright:' comments are not allowed in app/. Fix the type."
            fail=1
          fi
          if [ -f pyrightconfig.json ]; then
            echo "::error::pyrightconfig.json would override [tool.pyright] in pyproject.toml; remove it."
            fail=1
          fi
          section="$(awk '/^\[tool\.pyright\]/{f=1;next} /^\[/{f=0} f' pyproject.toml)"
          if echo "$section" | grep -nE '^\s*(report[A-Za-z]+|ignore|exclude|strict)\s*=|enableTypeIgnoreComments\s*=\s*true|typeCheckingMode\s*=\s*"(off|basic)"'; then
            echo "::error::[tool.pyright] must not disable rules, exclude files, or relax the checking mode."
            fail=1
          fi
          if ! echo "$section" | grep -qE '^\s*include\s*=\s*\["app"\]'; then
            echo "::error::[tool.pyright] must set include = [\"app\"]."
            fail=1
          fi
          exit $fail

      - name: Run backend tests
        run: pytest --cov=app --cov-report=

      - name: Show coverage report (sorted by coverage, ascending)
        run: coverage report --show-missing --sort=cover

  frontend-ci:
    # Includes the SCRUM-206 Playwright regression suite (Sprint 1 & 2 test
    # cases against a mocked backend, frontend/e2e) — one job, one install,
    # instead of a second job repeating checkout/setup-node/npm ci.
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run regression tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  publish-images:
    name: Publish Docker images
    needs:
      - backend-ci
      - frontend-ci
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            dockerfile: backend/Dockerfile
            image_name: six-sevens-backend
          - name: frontend
            dockerfile: frontend/Dockerfile
            image_name: six-sevens-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set image repository
        id: set-image-repo
        run: echo "image_repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image_name }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # GHCR often fails BuildKit attestation blobs with "unknown blob".
          provenance: false
          sbom: false
          # Build secret for the backend image's zoning index (the frontend ignores it).
          secrets: |
            data_gov_sg_api_key=${{ secrets.DATA_GOV_SG_API_KEY }}
          tags: |
            ${{ steps.set-image-repo.outputs.image_repo }}:latest
            ${{ steps.set-image-repo.outputs.image_repo }}:${{ github.sha }}