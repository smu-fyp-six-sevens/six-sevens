name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: placeholder-key
      SUPABASE_STORAGE_BUCKET: documents
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install exiftool (the metadata and AI-provenance tests need it)
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libimage-exiftool-perl
          exiftool -ver

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app

      - name: Type check (pyright) - fails the build
        run: pyright app

      - name: Reject type-check suppressions and weakened pyright config
        run: |
          fail=0
          if grep -rnE "#\s*(type:\s*ignore|pyright:)" app --include=*.py; then
            echo "::error::'# type: ignore' and '# pyright:' comments are not allowed in app/. Fix the type."
            fail=1
          fi
          if [ -f pyrightconfig.json ]; then
            echo "::error::pyrightconfig.json would override [tool.pyright] in pyproject.toml; remove it."
            fail=1
          fi
          section="$(awk '/^\[tool\.pyright\]/{f=1;next} /^\[/{f=0} f' pyproject.toml)"
          if echo "$section" | grep -nE '^\s*(report[A-Za-z]+|ignore|exclude|strict)\s*=|enableTypeIgnoreComments\s*=\s*true|typeCheckingMode\s*=\s*"(off|basic)"'; then
            echo "::error::[tool.pyright] must not disable rules, exclude files, or relax the checking mode."
            fail=1
          fi
          if ! echo "$section" | grep -qE '^\s*include\s*=\s*\["app"\]'; then
            echo "::error::[tool.pyright] must set include = [\"app\"]."
            fail=1
          fi
          exit $fail

      - name: Run backend tests
        run: pytest --cov=app --cov-report=

      - name: Show coverage report (sorted by coverage, ascending)
        run: coverage report --show-missing --sort=cover

  frontend-ci:
    # Includes the SCRUM-206 Playwright regression suite (Sprint 1 & 2 test
    # cases against a mocked backend, frontend/e2e) — one job, one install,
    # instead of a second job repeating checkout/setup-node/npm ci.
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run regression tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  security:
    # Non-blocking until the first findings are reviewed (CLOUD_ARCHITECTURE_PLAN.md section 6); then
    # remove continue-on-error so a high-severity finding fails the build.
    name: Security (Checkov, Snyk)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Checkov (Terraform, Dockerfiles, workflows)
        run: |
          python -m pip install "checkov>=3.2,<4"
          checkov -d deploy/terraform --framework terraform --compact --quiet
          checkov --framework dockerfile -f backend/Dockerfile -f deploy/kong/Dockerfile -f frontend/Dockerfile --compact --quiet
          checkov -d .github/workflows --framework github_actions --compact --quiet

      - name: Snyk (Python and npm dependencies)
        if: ${{ env.SNYK_TOKEN != '' }}
        run: |
          # Snyk reads installed packages for a requirements file, so install them first.
          python -m pip install -r backend/requirements.txt
          npx --yes snyk@1 test --file=backend/requirements.txt --package-manager=pip --severity-threshold=high
          cd frontend && npm ci && npx --yes snyk@1 test --severity-threshold=high

      - name: pip-audit and npm audit (when there is no Snyk token)
        if: ${{ env.SNYK_TOKEN == '' }}
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.txt
          cd frontend && npm ci && npm audit --audit-level=high
