name: Deploy to GKE

# Runs after CI passes on a push to main (called from ci-cd.yml), or by hand (Actions tab -> "Deploy to
# GKE" -> "Run workflow"). Builds and scans one image per service, then signs them and releases them to GKE
# through Cloud Deploy, which runs the gateway checks; a failed rollout is rolled back.
on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # Workload Identity Federation

# One deploy at a time; a newer one waits, and a deploy is never cancelled halfway (that would skip the rollback).
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'asia-southeast1' }}
  REGISTRY: ${{ vars.GCP_REGION || 'asia-southeast1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/app
  # The only list of services in this workflow; every step reads it. Adding one: docs/ADDING_A_SERVICE.md.
  # Backend roles: a target each in backend/Dockerfile.
  BACKEND_ROLES: api doc-worker detection-worker case-worker audit-metrics
  # Other services, as name=Dockerfile.
  OTHER_SERVICES: kong=deploy/kong/Dockerfile frontend=frontend/Dockerfile grafana=deploy/grafana/Dockerfile

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # One access token for the whole job, minted once: gcloud and Docker use it directly, so nothing goes
      # back to GitHub's token service mid-run (it times out now and then). 20 minutes: it must outlast the
      # whole build, since each image is pushed as it finishes.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: access_token
          access_token_lifetime: 1200s
          create_credentials_file: false

      - uses: google-github-actions/setup-gcloud@v2

      - name: Give gcloud the token
        run: echo "CLOUDSDK_AUTH_ACCESS_TOKEN=${{ steps.auth.outputs.access_token }}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # Every image is also loaded on the runner (below), so make room: the runner's preinstalled SDKs take ~20 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      # The build cache lives in GitHub's Actions cache, not Artifact Registry: pulling it from the registry to
      # GitHub's runners is billed as internet egress on every push. buildx run by hand needs the cache's
      # runtime token, which this exposes. Past the cache's 10 GB, old entries are evicted: a slower build, not a failure.
      - uses: crazy-max/ghaction-github-runtime@v3

      - name: Build and push every image
        env:
          # A build secret, so the key stays out of the image layers.
          DATA_GOV_SG_API_KEY: ${{ secrets.DATA_GOV_SG_API_KEY }}
        run: |
          # build <image> <dockerfile> [buildx args...]: skipped when this commit's image already exists
          # (a rerun), otherwise unchanged layers come from the cache.
          build() {
            image=$1; file=$2; shift 2
            if gcloud artifacts docker images describe "$REGISTRY/$image:$GITHUB_SHA" >/dev/null 2>&1; then
              echo "$image:$GITHUB_SHA is already built; skipping"
              return
            fi
            # --provenance=false: one manifest per image, not an index with untagged children that Artifact
            # Registry's clean-up policy (deploy/terraform/main.tf) could delete. --load keeps a copy on the runner,
            # so the scan and the SBOM below read it here instead of pulling it back from the registry.
            docker buildx build -f "$file" "$@" --provenance=false \
              --cache-from "type=gha,scope=$image" \
              --cache-to "type=gha,scope=$image,mode=max" \
              -t "$REGISTRY/$image:$GITHUB_SHA" --push --load .
            echo "$image" >> built.txt
          }
          touch built.txt
          for role in $BACKEND_ROLES; do
            # Every role shares the dependency layers, so each may also start from api's cache.
            build "$role" backend/Dockerfile --target "$role" --build-arg GIT_COMMIT="$GITHUB_SHA" \
              --cache-from "type=gha,scope=api" \
              --secret id=data_gov_sg_api_key,env=DATA_GOV_SG_API_KEY
          done
          for entry in $OTHER_SERVICES; do
            name=${entry%%=*}; file=${entry#*=}
            case "$name" in
              # Vite bakes the API's URL in at build time.
              frontend) build "$name" "$file" --build-arg VITE_API_URL="https://api.${{ vars.GKE_DOMAIN || 'sixsevens.me' }}" ;;
              *) build "$name" "$file" ;;
            esac
          done

      # Free scanning in place of Artifact Analysis's paid on-push scans. Our backend images block on a fixable high
      # or critical finding; Kong, the frontend and Grafana only report (their findings come from upstream images).
      # A scanner that can't run (install, database download) only warns: it can't stop a deploy.
      - uses: aquasecurity/setup-trivy@v0.3.1
        continue-on-error: true
        with:
          version: v0.76.1
          cache: true

      - name: Scan every image (Trivy)
        timeout-minutes: 10
        run: |
          if ! command -v trivy >/dev/null; then echo "::warning::Trivy isn't installed; images not scanned"; exit 0; fi
          failed=""
          scan() {
            image=$1; blocking=$2
            echo "::group::$image"
            # The copy this job built, on the runner; only a rerun's skipped image is read from the registry.
            src=remote
            grep -qx "$image" built.txt && src=docker
            # Exit code 3 means findings; anything else non-zero is the scanner itself failing.
            set +e
            trivy image --quiet --image-src "$src" --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 3 \
              "$REGISTRY/$image:$GITHUB_SHA"
            rc=$?
            set -e
            echo "::endgroup::"
            if [ "$rc" = 3 ] && [ "$blocking" = yes ]; then failed="$failed $image"
            elif [ "$rc" = 3 ]; then echo "::warning::$image has fixable high or critical findings (report only)"
            elif [ "$rc" != 0 ]; then echo "::warning::Trivy couldn't scan $image (exit $rc)"; fi
          }
          for role in $BACKEND_ROLES; do scan "$role" yes; done
          for entry in $OTHER_SERVICES; do scan "${entry%%=*}" no; done
          if [ -n "$failed" ]; then
            echo "::error::Fixable high or critical findings in:$failed (the tables above say which packages)"
            exit 1
          fi

      # Each built image's SBOM, from the runner's copy; the gke job attests it. An image missing here (a rerun)
      # gets its SBOM from the registry there.
      - uses: anchore/sbom-action/download-syft@v0
      - name: SBOM of every built image
        run: |
          mkdir -p sboms
          while read -r image; do
            syft scan "docker:$REGISTRY/$image:$GITHUB_SHA" -o spdx-json -q > "sboms/sbom-$image.json"
          done < built.txt
          ls -l sboms
      - uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: sboms/
          retention-days: 1
          if-no-files-found: ignore

  # GKE (HOW_IT_WORKS.md §9, "Releases on GKE"), once Terraform has made the cluster (repository variable
  # GKE_ENABLED=true). Signs every image (cosign signature, SBOM and build provenance, and the Binary
  # Authorization attestation, all with one Cloud KMS key), renders the chart with the images by digest, and hands
  # it to Cloud Deploy, which applies it, records it and runs the gateway checks. A failed rollout is rolled back.
  gke:
    needs: build
    if: vars.GKE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: write # the release's values, committed for Argo CD
      id-token: write
    env:
      # cosign's documented form for a Cloud KMS key version.
      KMS_KEY: projects/${{ vars.GCP_PROJECT_ID }}/locations/${{ vars.GCP_REGION || 'asia-southeast1' }}/keyRings/six-sevens/cryptoKeys/image-signing/versions/1
    steps:
      - uses: actions/checkout@v5

      # The token for gcloud and Docker; cosign signs through Cloud KMS with the credentials file. An hour: the
      # rollout is waited for here.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: access_token
          access_token_lifetime: 3600s
          create_credentials_file: true

      # The attestation command is in gcloud's beta component.
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: beta

      - name: Give gcloud the token
        run: echo "CLOUDSDK_AUTH_ACCESS_TOKEN=${{ steps.auth.outputs.access_token }}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # Pinned: a new major version could change the signing flags.
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.3
      - uses: anchore/sbom-action/download-syft@v0
      # The SBOMs the build job made; none on a rerun that built nothing.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: sboms
          path: sboms
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      # The images are signed in parallel, which takes about as long as the largest one; an image a push didn't change
      # keeps its digest and its earlier signatures.
      - name: Sign and attest every image
        run: |
          sign() {  # sign <image>: its SBOM, cosign signature and attestation, and the Binary Authorization attestation
            image=$1
            digest=$(gcloud artifacts docker images describe "$REGISTRY/$image:$GITHUB_SHA" --format='value(image_summary.digest)')
            ref="$REGISTRY/$image@$digest"
            # An image this push didn't change keeps its digest, so an earlier run may have signed it already.
            if cosign verify-attestation --insecure-ignore-tlog=true --key "gcpkms://$KMS_KEY" --type spdxjson \
                "$ref" > /dev/null 2>&1; then
              echo "$image already has its signature and SBOM"
            else
              sbom_and_sign "$image" "$ref"
            fi
            # Binary Authorization refuses a second attestation of a digest as a conflict: it's already attested.
            if ! out=$(gcloud beta container binauthz attestations sign-and-create --quiet --artifact-url="$ref" \
                --attestor=built-by-ci --attestor-project="$PROJECT_ID" --keyversion-project="$PROJECT_ID" \
                --keyversion-location="$REGION" --keyversion-keyring=six-sevens --keyversion-key=image-signing \
                --keyversion=1 2>&1); then
              echo "$out"
              echo "$out" | grep -q "subject of a conflict" || return 1
              echo "$image already attested"
            fi
            echo "$image $ref" > "image-$image.txt"
          }
          sbom_and_sign() {  # sbom_and_sign <image> <ref>
            image=$1; ref=$2
            # The build job's SBOM; from the registry only when it has none (a rerun), since pulling is billed egress.
            if [ -s "sboms/sbom-$image.json" ]; then
              cp "sboms/sbom-$image.json" "sbom-$image.json"
            else
              syft scan "registry:$ref" -o spdx-json -q > "sbom-$image.json"
            fi
            # No public transparency log: the signatures stay in our registry.
            cosign sign --yes --tlog-upload=false --key "gcpkms://$KMS_KEY" "$ref"
            cosign attest --yes --tlog-upload=false --key "gcpkms://$KMS_KEY" --type spdxjson --predicate "sbom-$image.json" "$ref"
            # Build provenance (SLSA v1): which repository, commit and workflow run built it, signed with the same key.
            # GitHub's own attestations need a paid plan on a private repository.
            repo="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            printf '%s' "{\"buildDefinition\":{\"buildType\":\"https://github.com/actions/runner\",\"externalParameters\":{\"repository\":\"$repo\",\"ref\":\"$GITHUB_REF\",\"workflow\":\"$GITHUB_WORKFLOW_REF\",\"image\":\"$image\"},\"resolvedDependencies\":[{\"uri\":\"git+$repo@$GITHUB_REF\",\"digest\":{\"gitCommit\":\"$GITHUB_SHA\"}}]},\"runDetails\":{\"builder\":{\"id\":\"$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF\"},\"metadata\":{\"invocationId\":\"$repo/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT\"}}}" \
              > "provenance-$image.json"
            # A warning, not a failure: the signature and SBOM above are what Binary Authorization relies on.
            cosign attest --yes --tlog-upload=false --key "gcpkms://$KMS_KEY" --type slsaprovenance1 \
              --predicate "provenance-$image.json" "$ref" || echo "::warning::provenance attestation failed for $image"
          }
          pids=""
          for image in $BACKEND_ROLES kong frontend grafana; do
            sign "$image" > "sign-$image.log" 2>&1 &
            pids="$pids $!:$image"
          done
          fail=0
          for entry in $pids; do
            pid=${entry%%:*}; image=${entry#*:}
            if wait "$pid"; then echo "signed $image"; else echo "::error::signing $image failed"; cat "sign-$image.log"; fail=1; fi
          done
          [ "$fail" = 0 ]
          cat image-*.txt > images.txt
          cat images.txt

      - name: Render the release
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: |
          LB=$(gcloud compute addresses describe sixsevens-lb --global --format='value(address)')
          args=()
          while read -r image ref; do
            case "$image" in
              kong) args+=(--set "images.kong=$ref") ;;
              frontend) args+=(--set "images.frontend=$ref") ;;
              grafana) args+=(--set "images.grafana=$ref") ;;
              *) args+=(--set "images.backend.$image=$ref") ;;
            esac
          done < images.txt
          mkdir -p release
          cp deploy/clouddeploy/skaffold.yaml release/
          C=deploy/helm/six-sevens
          helm template six "$C" -f "$C/values-roles.yaml" -f "$C/values-prod.yaml" \
            --set projectId="$PROJECT_ID" --set supabaseUrl="$SUPABASE_URL" --set gateway.address="$LB" \
            "${args[@]}" > release/manifest.yaml
          grep -c '^kind:' release/manifest.yaml

      # A fresh token: signing, the rollout (up to 15 minutes) and verify (up to 15) can outlast the first one.
      - id: auth-release
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: access_token
          access_token_lifetime: 3600s
          create_credentials_file: false

      - name: Give gcloud the new token
        run: echo "CLOUDSDK_AUTH_ACCESS_TOKEN=${{ steps.auth-release.outputs.access_token }}" >> "$GITHUB_ENV"

      - name: Release, and wait for the rollout
        run: |
          # Unique per run, so deploying the same commit twice doesn't clash.
          release="r-${GITHUB_SHA::8}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gcloud deploy releases create "$release" --delivery-pipeline=six-sevens --region="$REGION" \
            --source=release --skaffold-file=skaffold.yaml \
            --gcs-source-staging-dir="gs://$PROJECT_ID-clouddeploy/source" --quiet
          state=""
          for _ in $(seq 1 180); do
            state=$(gcloud deploy rollouts list --release="$release" --delivery-pipeline=six-sevens \
              --region="$REGION" --format='value(state)' | head -1)
            echo "rollout: ${state:-pending}"
            case "$state" in
              SUCCEEDED) echo "### Deployed $GITHUB_SHA to GKE ($release)" >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
              FAILED|CANCELLED|HALTED) break ;;
            esac
            sleep 15
          done
          echo "::error::The GKE rollout of $release did not succeed (${state:-timed out}); rolling back"
          # To the newest release that last rolled out fine. A plain rollback steps back from the release Cloud Deploy
          # still counts as current (the last good one, since this one failed), so it went one release too far.
          good=""
          for r in $(gcloud deploy releases list --delivery-pipeline=six-sevens --region="$REGION" \
              --sort-by=~createTime --limit=10 --format='value(name.basename())'); do
            [ "$r" = "$release" ] && continue
            if gcloud deploy rollouts list --release="$r" --delivery-pipeline=six-sevens --region="$REGION" \
                --format='value(state)' | grep -qx SUCCEEDED; then good=$r; break; fi
          done
          if [ -n "$good" ]; then
            echo "Rolling back to $good"
            gcloud deploy targets rollback prod --delivery-pipeline=six-sevens --region="$REGION" --release="$good" --quiet \
              || echo "::warning::The rollback to $good failed; roll back by hand (deploy/terraform/README.md)"
          else
            echo "::warning::No earlier release rolled out fine; nothing to roll back to"
          fi
          exit 1

      # Argo CD watches main (deploy/argocd/application.yaml), so git records what was released. Never fails the deploy.
      - name: Record the release for Argo CD
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: |
          C=deploy/helm/six-sevens
          LB=$(gcloud compute addresses describe sixsevens-lb --global --format='value(address)')
          {
            echo "# Written by deploy.yml after each release, for Argo CD. Not secrets."
            echo "projectId: $PROJECT_ID"
            echo "supabaseUrl: $SUPABASE_URL"
            echo "gateway:"
            echo "  address: \"$LB\""
          } > "$C/values-gitops.yaml"
          {
            echo "# Written by deploy.yml after each release: the signed images, by digest."
            echo "images:"
            grep -E '^(kong|frontend|grafana) ' images.txt | while read -r image ref; do echo "  $image: $ref"; done
            echo "  backend:"
            grep -vE '^(kong|frontend|grafana) ' images.txt | while read -r image ref; do echo "    $image: $ref"; done
          } > "$C/values-images.yaml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$C/values-gitops.yaml" "$C/values-images.yaml"
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -q -m "Release ${GITHUB_SHA::8} for Argo CD [skip ci]"
          for _ in 1 2 3; do
            git fetch -q --depth=50 origin main && git rebase -q origin/main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          echo "::warning::Couldn't commit the release for Argo CD (is main protected?); it will show out of sync"
