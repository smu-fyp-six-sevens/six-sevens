# The one Application: the Helm chart at main, with the values CI commits after each signed release
# (values-gitops.yaml, values-images.yaml). Watch only: Cloud Deploy releases and rolls back; Argo CD shows whether
# the cluster matches main, and what drifted. Apply with
#   kubectl apply -n argocd -f deploy/argocd/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: six-sevens
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/smu-fyp-six-sevens/six-sevens.git
    targetRevision: main
    path: deploy/helm/six-sevens
    helm:
      releaseName: six      # the name deploy.yml renders with
      ignoreMissingValueFiles: true   # until the first deploy has written the last two
      valueFiles:
        - values-roles.yaml
        - values-prod.yaml
        - values-gitops.yaml   # projectId, supabaseUrl, gateway.address (not secrets)
        - values-images.yaml   # images by digest
  destination:
    server: https://kubernetes.default.svc
  # KEDA and the HPAs own the replica counts.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    # No automated sync: Cloud Deploy releases. Replacing it: turn this on, and see deploy/terraform/README.md.
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
