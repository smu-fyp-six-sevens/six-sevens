name: Deploy to Cloud Run

# Manual only (Actions tab -> "Deploy to Cloud Run" -> "Run workflow").
# Terraform (deploy/terraform) owns each service's configuration; this only builds one image per role,
# rolls it out, checks the gateway, and rolls every service back if the check fails.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # Workload Identity Federation

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'asia-southeast1' }}
  REGISTRY: ${{ vars.GCP_REGION || 'asia-southeast1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Log in to Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push every image
        env:
          # A build secret, so the key stays out of the image layers.
          DATA_GOV_SG_API_KEY: ${{ secrets.DATA_GOV_SG_API_KEY }}
        run: |
          KONG_URL=$(gcloud run services describe kong --region "$REGION" --format='value(status.url)')
          # build <image> <dockerfile> [buildx args...]: skipped when this commit's image already exists
          # (a rerun), otherwise unchanged layers come from the cache kept in Artifact Registry.
          build() {
            image=$1; file=$2; shift 2
            if gcloud artifacts docker images describe "$REGISTRY/$image:$GITHUB_SHA" >/dev/null 2>&1; then
              echo "$image:$GITHUB_SHA is already built; skipping"
              return
            fi
            docker buildx build -f "$file" "$@" \
              --cache-from "type=registry,ref=$REGISTRY/buildcache:$image" \
              --cache-to "type=registry,ref=$REGISTRY/buildcache:$image,mode=max,image-manifest=true,oci-mediatypes=true" \
              -t "$REGISTRY/$image:$GITHUB_SHA" --push .
          }
          for role in api doc-worker detection-worker case-worker audit-metrics; do
            # Every role shares the dependency layers, so each may also start from api's cache.
            build "$role" backend/Dockerfile --target "$role" \
              --cache-from "type=registry,ref=$REGISTRY/buildcache:api" \
              --secret id=data_gov_sg_api_key,env=DATA_GOV_SG_API_KEY
          done
          build kong deploy/kong/Dockerfile
          build frontend frontend/Dockerfile --build-arg VITE_API_URL="$KONG_URL"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Record the revisions now serving
        run: |
          : > previous.txt
          for svc in api doc-worker detection-worker case-worker audit-metrics kong frontend; do
            rev=$(gcloud run services describe "$svc" --region "$REGION" --format='value(status.latestReadyRevisionName)')
            echo "$svc $rev" >> previous.txt
          done
          cat previous.txt

      - name: Roll out the new images
        run: |
          # Workers and audit-metrics first, so the api never publishes to an older consumer.
          pids=""
          for svc in audit-metrics doc-worker detection-worker case-worker api kong frontend; do
            # The backend roles also run the metrics sidecar, so name the app container. Every flag after
            # --container belongs to that container, so the service-wide ones (--quiet) go before it.
            container=""; case "$svc" in kong|frontend) ;; *) container="--container app" ;; esac
            gcloud run services update "$svc" --region "$REGION" --quiet $container --image "$REGISTRY/$svc:$GITHUB_SHA" &
            pids="$pids $!"
          done
          fail=0
          for pid in $pids; do wait "$pid" || fail=1; done
          exit $fail

      - name: Check the gateway (no LLM, no database writes)
        id: check
        run: |
          KONG_URL=$(gcloud run services describe kong --region "$REGION" --format='value(status.url)')
          FRONTEND_URL=$(gcloud run services describe frontend --region "$REGION" --format='value(status.url)')
          WORKER_URL=$(gcloud run services describe detection-worker --region "$REGION" --format='value(status.url)')
          expect() {  # expect <status> <method> <url> [curl args...]
            want=$1; method=$2; url=$3; shift 3
            got=$(curl -s -o /dev/null -w '%{http_code}' -X "$method" "$url" "$@")
            echo "$method $url -> $got (want $want)"
            [ "$got" = "$want" ]
          }
          # /health, not /healthz: Cloud Run's front end reserves paths ending in "z" and answers them itself.
          expect 200 GET "$KONG_URL/health"
          expect 401 GET "$KONG_URL/cases"
          expect 401 GET "$KONG_URL/audit/events"
          expect 404 POST "$KONG_URL/push/doc-worker"
          expect 200 GET "$FRONTEND_URL/"
          # Only Pub/Sub's identity may invoke a worker.
          expect 403 POST "$WORKER_URL/push/detection-worker"
          # The frontend origin passes CORS.
          curl -s -o /dev/null -D - -X OPTIONS "$KONG_URL/cases" -H "Origin: $FRONTEND_URL" \
            -H "Access-Control-Request-Method: GET" | grep -qi "access-control-allow-origin: $FRONTEND_URL"

      - name: Roll back every service
        if: failure()
        run: |
          while read -r svc rev; do
            [ -n "$rev" ] && gcloud run services update-traffic "$svc" --region "$REGION" --to-revisions "$rev=100" --quiet
          done < previous.txt

      - name: Summary
        if: success()
        run: |
          {
            echo "### Deployed $GITHUB_SHA"
            echo "- Frontend: $(gcloud run services describe frontend --region "$REGION" --format='value(status.url)')"
            echo "- API (Kong): $(gcloud run services describe kong --region "$REGION" --format='value(status.url)')"
          } >> "$GITHUB_STEP_SUMMARY"
