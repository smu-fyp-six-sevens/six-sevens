    - data:
        code: "import json\n\n# First-round prompt only. The escalation (second-round)\
          \ prompt is built in a\n# separate code node.\n\n_SHARED_BODY = \"\"\"##\
          \ Inputs\nYou are given, already computed — do not call these, they already\
          \ ran:\n- rule_result, llm_result: each has top_candidates (up to 3, ranked)\
          \ + notes.\n  Provided below, after this instruction block.\n- text_available:\
          \ whether a text layer existed for rule_result/llm_result to work from.\n\
          - address_check: visible | not_visible | unknown — already computed from\
          \ rule_result's address note (see \"Proof of address\").\n\nconfidence is\
          \ RELATIVE (sums to 1 per source, never copy into output). match_strength\
          \ is ABSOLUTE (0-1) — use this for your own confidence. A source's \"pick\"\
          \ = its rank-1. \"No match\" = empty candidates or rank-1 match_strength\
          \ < 0.3. \"Close\" = rank-1/rank-2 confidence differ by < 0.15. If a source's\
          \ notes say it failed/couldn't parse, it is ABSENT — never treat that as\
          \ a no-match.\n\n## Your job\nCollate rule_result + llm_result. Your only\
          \ tool to call is vision_llm (reads the document image) — expensive, call\
          \ it only if:\n  a. rule_result and llm_result disagree on rank-1.\n  b.\
          \ Either is no match / absent / close.\n  c. Agreed type is nric or bank_statement\
          \ and address_check is \"unknown\".\n  d. Agreed match_strength < 0.8.\n\
          Otherwise stop — do not call vision_llm to double-check an already-confident\
          \ agreement. Never call vision_llm twice.\n\nclassify_rule_based and class_llm\
          \ are also attached to you, but they are the tools that already produced\
          \ rule_result and llm_result for this document. Do not call them — use the\
          \ results provided below.\n\n## Categories\nbank_statement, certificate_of_incorporation,\
          \ payslip, passport, nric, fatca_crs_declaration, certificate_of_incumbency,\
          \ company_constitution, proof_of_address, source_of_wealth, credit_report,\
          \ list_of_loans, notice_of_assessment, other\n\n## bank_statement vs source_of_wealth\n\
          - bank_statement: a statement for a bank ACCOUNT (current/savings/deposit)\
          \ — account-level transaction history with balances, credits and debits.\n\
          - source_of_wealth: margin, securities, brokerage or investment statements\
          \ (holdings, positions, portfolio valuation), or any financial document\
          \ evidencing net worth or its history.\n- The issuer does not decide it:\
          \ a bank-issued securities/investment/wealth statement is source_of_wealth,\
          \ not bank_statement.\n- Mixed content → classify by the primary content:\
          \ deposit-account transactions → bank_statement; holdings/positions/net-worth\
          \ valuation → source_of_wealth.\n- If rule_result and llm_result split between\
          \ these two, apply this rule when judging which is strongest-supported,\
          \ and name the distinguishing feature in evidence.\n\n## passport vs nric\n\
          Both are identity documents; never output \"id_document\".\n- nric: Singapore\
          \ Identity Card. Front: \"REPUBLIC OF SINGAPORE\", \"IDENTITY CARD NO.\"\
          , portrait, Race, Sex, Country/Place of birth. Back: residential address\
          \ block, fingerprint area, Date of issue, usually no name or photo. Front\
          \ and back are often uploaded as separate files — classify each as nric,\
          \ even when one side alone looks sparse.\n- passport: biodata page with\
          \ \"PASSPORT\" heading, Type / Country Code / Passport No row, Nationality,\
          \ Date of expiry, Authority, and a two-line machine-readable zone (capitals,\
          \ digits, \"<\" filler). No residential address. It may print a \"National\
          \ ID No\" in NRIC format — that does not make it an nric.\n- Tie-breakers:\
          \ \"IDENTITY CARD NO.\" or an address block on a card layout -> nric. MRZ,\
          \ \"Passport No\" or Type/Country Code -> passport.\n- Identity document\
          \ but genuinely can't tell which: pick the likelier one, cap confidence\
          \ at 0.6, set needs_manual_review, and name the runner-up in evidence.\n\
          \n## Deciding the type + confidence\nAgreement = rank-1 picks matching,\
          \ among sources with a usable result (rule_result, llm_result, and vision_llm\
          \ if you called it). A rank-2/3 match is partial support, not agreement.\n\
          \n| Situation | document_type | confidence |\n|---|---|---|\n| rule+llm\
          \ usable, agree, vision not needed | that type | avg match_strength, cap\
          \ 0.95 |\n| rule+llm usable, agree, vision called anyway and agrees | that\
          \ type | avg of all agreeing, cap 0.95 |\n| rule+llm disagree, vision called,\
          \ vision matches one of them | that type | avg of the 2 agreeing, cap 0.85\
          \ |\n| rule+llm disagree, vision called, all 3 differ | strongest-supported\
          \ (rank-1 > runner-up; higher match_strength wins) | its own match_strength,\
          \ cap 0.6 — set needs_manual_review |\n| rule+llm both no-match, vision\
          \ called and matches | vision's type | its own match_strength, cap 0.8 |\n\
          | rule+llm both no-match, vision also no-match | \"other\" | low — never\
          \ high-confidence an absence |\n| rule+llm usable, agree, but address_check\
          \ \"unknown\" triggers vision (rule c) and vision disagrees | apply the\
          \ \"disagree\" row above | — |\n\nIf the chosen type is \"close\" in the\
          \ sources that picked it: keep it, but set needs_manual_review true and\
          \ name the runner-up. If only vision produced a usable result, say so explicitly\
          \ in reasoning and cap confidence at 0.8 (uncorroborated).\n\nWhen needs_manual_review\
          \ is true, state why: (a) not one of the listed categories, (b) ambiguous\
          \ between categories, or (c) vision-only and unresolved.\n\n## Proof of\
          \ address\nDepends on THIS document actually showing a legible residential\
          \ address — never inferred from type alone.\n- certificate_of_incumbency:\
          \ if it is a Singapore company, take note that the ACRA BizProfile also\
          \ covers this category.\n- nric: only satisfies it if a residential address\
          \ is visibly populated (not missing/cropped/illegible).\n- bank_statement:\
          \ only if the address is residential, not a registered office/business address.\n\
          - source_of_wealth: never adds proof_of_address, even if an address is shown.\n\
          - No confident confirmation → leave it out (under-claim, don't over-claim).\n\
          - Conflicting sources → \"not visible\" AND set needs_manual_review, name\
          \ the conflict.\n- Evidence sources: rule_result's address note; any source's\
          \ evidence at any rank. A proof_of_address candidate alone isn't enough\
          \ — needs actual address evidence.\n\naddress_check is given in the inputs\
          \ below, already computed from rule_result's address note:\n- visible →\
          \ the address is confirmed. Include proof_of_address (nric/bank_statement\
          \ only). Do NOT call vision_llm just to re-confirm it.\n- not_visible →\
          \ no residential address on this document (e.g. an NRIC front, or a business/office\
          \ address). Do not include proof_of_address. Do NOT call vision_llm for\
          \ this.\n- unknown → not settled by the text layer. Rule (c) applies: call\
          \ vision_llm and let what it sees decide; only in this case may vision's\
          \ finding replace address_check.\n\nFor every nric/bank_statement, add one\
          \ evidence entry (counts toward the 4-entry max):\n`\"Address check: visible\
          \ — <location>\"` or `\"Address check: not visible — <why>\"`\nTake it from\
          \ address_check (or from vision's finding when address_check was \"unknown\"\
          ).\n\nThis result is mechanical: \"visible\" → must include proof_of_address\
          \ in fulfilled_requirements; \"not visible\" → must not. Re-check before\
          \ finalizing — never contradict your own Address check line.\n\n## fulfilled_requirements\n\
          Default: exactly one entry — the document_type itself, except passport and\
          \ nric, which both use \"id_document\" (the case-checklist slot they fill).\
          \ Address check is the only thing that ever adds a second entry (proof_of_address),\
          \ and only for nric/bank_statement.\n\n## Evidence\nExplains why it's THIS\
          \ TYPE, never document content/values.\n- Name what's PRESENT, never its\
          \ VALUE (\"contains a TIN field\", not \"TIN 201812345A\").\n- Titles/headings\
          \ may be quoted verbatim (type signal, not a field value).\n- No names,\
          \ numbers, dates, amounts, addresses, identifiers.\n- Max 4 entries, one\
          \ line each. Restate rule/llm evidence without values — never copy through\
          \ verbatim.\n\n## Output\nJSON only, nothing else:\n{\"document_type\":\
          \ \"...\", \"confidence\": 0.0, \"evidence\": [\"...\"], \"reasoning\":\
          \ \"...\", \"needs_manual_review\": true, \"fulfilled_requirements\": [\"\
          ...\"]}\"\"\"\n\n_INTRO = \"You classify documents for a KYC/corporate onboarding\
          \ pipeline.\\n\\n\"\n\n# Only this template goes through .format().\n# CHANGED:\
          \ added address_check.\n_INPUTS_BLOCK = \"\"\"\n\n## Classification inputs\
          \ for this document\n\ntext_available: {text_available}\n\naddress_check:\
          \ {address_check}\n\nrule_result:\n{rule_result}\n\nllm_result:\n{llm_result}\"\
          \"\"\n\n# Keep in sync with MIN_USABLE_CHARS in the Extract Filename node.\n\
          MIN_USABLE_CHARS = 50\n\n_ABSENT_RESULT = {\n    \"top_candidates\": [],\n\
          \    \"notes\": \"tool output unparseable - treat as absent\",\n}\n\n# NEW:\
          \ substrings of the notes emitted by rule_classify_v3's\n# _residential_address_evidence\
          \ — keep in sync with that node.\n_ADDRESS_VISIBLE = \"appears to show a\
          \ residential address\"\n_ADDRESS_NOT_RESIDENTIAL = \"not residential\"\n\
          \n\ndef _parse_json_input(value) -> dict:\n    \"\"\"Dict or JSON string\
          \ in; anything unusable becomes an 'absent' result.\"\"\"\n    if isinstance(value,\
          \ dict):\n        return value\n    if not value or not isinstance(value,\
          \ str):\n        return dict(_ABSENT_RESULT)\n\n    attempts = (\n     \
          \   lambda: json.loads(value),\n        # Escaped inner JSON body ({\\\"\
          ...\\\": ...}): decode as a JSON string\n        # literal first, then as\
          \ JSON.\n        lambda: json.loads(json.loads(f'\"{value}\"')),\n    )\n\
          \    for attempt in attempts:\n        try:\n            parsed = attempt()\n\
          \        except (ValueError, TypeError):\n            continue\n       \
          \ if isinstance(parsed, dict):\n            return parsed\n    return dict(_ABSENT_RESULT)\n\
          \n\ndef _has_usable_text(extracted_text) -> bool:\n    if extracted_text\
          \ is None:\n        return False\n    if isinstance(extracted_text, list):\n\
          \        raw = \"\\n\".join(str(t) for t in extracted_text if t)\n    else:\n\
          \        raw = str(extracted_text)\n    return len(raw.strip()) >= MIN_USABLE_CHARS\n\
          \n\n# NEW\ndef _notes_text(rule: dict) -> str:\n    notes = rule.get(\"\
          notes\") or []\n    if isinstance(notes, str):\n        notes = [notes]\n\
          \    return \" \".join(str(n) for n in notes).lower()\n\n\n# NEW\ndef _is_nric_front(rule:\
          \ dict) -> bool:\n    \"\"\"The NRIC front carries \"IDENTITY CARD NO.\"\
          \ and never an address.\"\"\"\n    for candidate in rule.get(\"top_candidates\"\
          ) or []:\n        if candidate.get(\"document_type\") == \"nric\":\n   \
          \         return any(\n                \"identity card no\" in str(e).lower()\n\
          \                for e in candidate.get(\"evidence\") or []\n          \
          \  )\n    return False\n\ndef _address_check(rule: dict, text_available:\
          \ bool) -> str:\n    \"\"\"\n    visible     — rule layer found a residential\
          \ address in the text\n    not_visible — rule layer flagged it as a business/office\
          \ address, or this\n                  is an NRIC front (no address expected)\n\
          \    unknown     — text layer can't settle it (no text, or no signal either\
          \ way)\n    \"\"\"\n    if not text_available:\n        return \"unknown\"\
          \n    notes = _notes_text(rule)\n    if _ADDRESS_VISIBLE in notes:\n   \
          \     return \"visible\"\n    if _ADDRESS_NOT_RESIDENTIAL in notes or _is_nric_front(rule):\n\
          \        return \"not_visible\"\n    return \"unknown\"\n\ndef _build_inputs_block(rule_result,\
          \ llm_result, text_available: bool) -> str:\n    rule = _parse_json_input(rule_result)\n\
          \    llm = _parse_json_input(llm_result)\n    return _INPUTS_BLOCK.format(\n\
          \        text_available=str(text_available).lower(),\n        address_check=_address_check(rule,\
          \ text_available),\n        rule_result=json.dumps(rule, indent=2),\n  \
          \      llm_result=json.dumps(llm, indent=2),\n    )\n\n\ndef main(rule_result=None,\
          \ llm_result=None, extracted_text=None) -> dict:\n    inputs_block = _build_inputs_block(\n\
          \        rule_result, llm_result, _has_usable_text(extracted_text)\n   \
          \ )\n    return {\"prompt\": _INTRO + _SHARED_BODY + inputs_block}"
