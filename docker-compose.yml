services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      secrets:
        - data_gov_sg_api_key
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-documents}
      AUTH_USERS: ${AUTH_USERS:-}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      INJECTION_GENERATED_DIR: /app/documents_generated
    volumes:
      - ./backend/documents_generated:/app/documents_generated

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

secrets:
  data_gov_sg_api_key:
    environment: DATA_GOV_SG_API_KEY
