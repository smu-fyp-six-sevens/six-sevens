# Cloud Deploy's release source (deploy/terraform/supply_chain.tf). The deploy renders the chart itself, with images
# by digest, into manifest.yaml beside this file, so each release records exactly what was applied. Verify runs
# the gateway checks through the load balancer (no Claude, no database writes); a failure fails the rollout and
# the deploy rolls the target back to its previous release.
apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: six-sevens
manifests:
  rawYaml:
    - manifest.yaml
deploy:
  # Pods on a fraction of a vCPU start slowly, and Autopilot may add a node first.
  statusCheckDeadlineSeconds: 900
  kubectl: {}
verify:
  - name: gateway-checks
    container:
      name: checks
      image: curlimages/curl:8.11.1
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          # A new or changed Gateway takes several minutes to serve, and a pod swap can leave a host briefly without a
          # healthy backend: wait up to 15 minutes until both hosts answer. Grafana is off since 2026-11-20 (values-prod.yaml);
          # with it back on, add its checks here: 200 on grafana.sixsevens.me/api/health, 401 on a dashboard.
          code() { curl -s -m 10 -o /dev/null -w '%{http_code}' "$1"; }
          ready=""
          for _ in $(seq 1 60); do
            if curl -s -m 10 https://api.sixsevens.me/health | grep -q '"status":"ok"' \
              && [ "$(code https://sixsevens.me/)" = 200 ]; then
              ready=yes; break
            fi
            echo "waiting for the hosts ..."
            sleep 15
          done
          [ -n "$ready" ] || { echo "The load balancer didn't serve every host within 15 minutes"; exit 1; }
          # Each check gets three tries, 10 s apart, so one blip doesn't fail the release; a real fault still does.
          expect() {
            for try in 1 2 3; do
              got=$(curl -s -m 20 -o /dev/null -w '%{http_code}' -X "$2" "$3")
              echo "$2 $3 -> $got (want $1)"
              [ "$got" = "$1" ] && return 0
              [ "$try" = 3 ] || sleep 10
            done
            return 1
          }
          expect 200 GET https://api.sixsevens.me/health
          expect 401 GET https://api.sixsevens.me/cases
          expect 401 GET https://api.sixsevens.me/audit/events
          expect 404 GET https://api.sixsevens.me/metrics
          expect 404 POST https://api.sixsevens.me/push/doc-worker
          expect 200 GET https://sixsevens.me/
          expect 301 GET http://sixsevens.me/
          curl -s -m 20 -o /dev/null -D - -X OPTIONS https://api.sixsevens.me/cases -H "Origin: https://sixsevens.me" \
            -H "Access-Control-Request-Method: GET" | grep -qi "access-control-allow-origin: https://sixsevens.me"
          echo "Gateway checks passed."
