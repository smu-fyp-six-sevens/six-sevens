# Local scrape config (deploy/compose/observability.yaml). `namespace` names the service, as Cloud Run's
# Managed Prometheus sidecar does, so the Grafana dashboards work unchanged. Targets that aren't running show
# as down; the Cloud Run and Pub/Sub panels stay empty locally.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: app
    static_configs:
      - targets: ["api:8000"]
        labels: { namespace: api }
      - targets: ["workers:8000"]
        labels: { namespace: workers }
      - targets: ["audit-metrics:8000"]
        labels: { namespace: audit-metrics }
      # Daily development: uvicorn on the host (all roles in one process).
      - targets: ["host.docker.internal:8000"]
        labels: { namespace: uvicorn }

  - job_name: kong
    static_configs:
      - targets: ["kong:8100"]
        labels: { namespace: kong }
