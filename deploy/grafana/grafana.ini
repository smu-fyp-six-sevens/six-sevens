# Grafana settings baked into the image (deploy/grafana/Dockerfile). The admin password is not here: it comes
# from GF_SECURITY_ADMIN_PASSWORD at run time (Secret Manager on Cloud Run, compose locally).

[server]
http_port = 3000

[auth.anonymous]
enabled = false

[users]
allow_sign_up = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[news]
news_feed_enabled = false

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/overview.json
