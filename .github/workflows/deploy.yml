name: Deploy to Cloud Run

# Runs after CI passes on a push to main (called from ci-cd.yml), or by hand (Actions tab -> "Deploy to
# Cloud Run" -> "Run workflow"). Terraform (deploy/terraform) owns each service's configuration; this only
# builds one image per role, rolls it out, checks the gateway, and rolls every service back if the check fails.
on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # Workload Identity Federation

# One deploy at a time; a newer one waits, and a deploy is never cancelled halfway (that would skip the rollback).
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'asia-southeast1' }}
  REGISTRY: ${{ vars.GCP_REGION || 'asia-southeast1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/app
  # The only list of services in this workflow; every step reads it. Adding one: docs/ADDING_A_SERVICE.md.
  # Backend roles: a target each in backend/Dockerfile; their main container is named "app".
  BACKEND_ROLES: api doc-worker detection-worker case-worker audit-metrics
  # Other services, as name=Dockerfile. Their main container is named after the service (they have a sidecar),
  # except the ones in SINGLE_CONTAINER.
  OTHER_SERVICES: kong=deploy/kong/Dockerfile frontend=frontend/Dockerfile grafana=deploy/grafana/Dockerfile
  SINGLE_CONTAINER: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # One access token for the whole job, minted once: gcloud and Docker use it directly, so nothing goes
      # back to GitHub's token service mid-run (it times out now and then). 20 minutes: it must outlast the
      # whole build, since each image is pushed as it finishes.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: access_token
          access_token_lifetime: 1200s
          create_credentials_file: false

      - uses: google-github-actions/setup-gcloud@v2

      - name: Give gcloud the token
        run: echo "CLOUDSDK_AUTH_ACCESS_TOKEN=${{ steps.auth.outputs.access_token }}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push every image
        env:
          # A build secret, so the key stays out of the image layers.
          DATA_GOV_SG_API_KEY: ${{ secrets.DATA_GOV_SG_API_KEY }}
        run: |
          KONG_URL=$(gcloud run services describe kong --region "$REGION" --format='value(status.url)')
          # build <image> <dockerfile> [buildx args...]: skipped when this commit's image already exists
          # (a rerun), otherwise unchanged layers come from the cache kept in Artifact Registry.
          build() {
            image=$1; file=$2; shift 2
            if gcloud artifacts docker images describe "$REGISTRY/$image:$GITHUB_SHA" >/dev/null 2>&1; then
              echo "$image:$GITHUB_SHA is already built; skipping"
              return
            fi
            # --provenance=false: one manifest per image, not an index with untagged children that Artifact
            # Registry's clean-up policy (deploy/terraform/main.tf) could delete.
            docker buildx build -f "$file" "$@" --provenance=false \
              --cache-from "type=registry,ref=$REGISTRY/buildcache:$image" \
              --cache-to "type=registry,ref=$REGISTRY/buildcache:$image,mode=max,image-manifest=true,oci-mediatypes=true" \
              -t "$REGISTRY/$image:$GITHUB_SHA" --push .
          }
          for role in $BACKEND_ROLES; do
            # Every role shares the dependency layers, so each may also start from api's cache.
            build "$role" backend/Dockerfile --target "$role" --build-arg GIT_COMMIT="$GITHUB_SHA" \
              --cache-from "type=registry,ref=$REGISTRY/buildcache:api" \
              --secret id=data_gov_sg_api_key,env=DATA_GOV_SG_API_KEY
          done
          for entry in $OTHER_SERVICES; do
            name=${entry%%=*}; file=${entry#*=}
            case "$name" in
              # Vite bakes the API's URL in at build time.
              frontend) build "$name" "$file" --build-arg VITE_API_URL="$KONG_URL" ;;
              *) build "$name" "$file" ;;
            esac
          done
          # GKE's frontend calls the API at its own fixed address (the gke job below).
          if [ "${{ vars.GKE_ENABLED }}" = "true" ]; then
            build frontend-gke frontend/Dockerfile --build-arg VITE_API_URL="https://api.${{ vars.GKE_DOMAIN || 'sixsevens.me' }}"
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # As in build: one 10-minute access token for the job.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: access_token
          access_token_lifetime: 600s
          create_credentials_file: false

      - uses: google-github-actions/setup-gcloud@v2

      - name: Give gcloud the token
        run: echo "CLOUDSDK_AUTH_ACCESS_TOKEN=${{ steps.auth.outputs.access_token }}" >> "$GITHUB_ENV"

      - name: Record the revisions now serving
        run: |
          : > previous.txt
          others=""; for entry in $OTHER_SERVICES; do others="$others ${entry%%=*}"; done
          for svc in $BACKEND_ROLES $others; do
            # The revision taking traffic, which after a rollback is not the newest one.
            rev=$(gcloud run services describe "$svc" --region "$REGION" --format='value(status.traffic[0].revisionName)')
            echo "$svc $rev" >> previous.txt
          done
          cat previous.txt

      - name: Roll out the new images
        run: |
          # shellcheck disable=SC2086 # the service lists and $container are split into words on purpose
          # roll <service>...: rolls them out in parallel and fails if any did.
          roll() {
            pids=""
            for svc in "$@"; do
              # Services with a sidecar need the main container named. Every flag after --container belongs
              # to that container, so the service-wide ones (--quiet) go before it.
              case " $BACKEND_ROLES " in
                *" $svc "*) container="--container app" ;;
                *) case " $SINGLE_CONTAINER " in *" $svc "*) container="" ;; *) container="--container $svc" ;; esac ;;
              esac
              # update keeps the traffic split as it is, and a rollback pins traffic to an old revision,
              # so traffic is moved to the new revision explicitly.
              {
                gcloud run services update "$svc" --region "$REGION" --quiet $container --image "$REGISTRY/$svc:$GITHUB_SHA" &&
                gcloud run services update-traffic "$svc" --region "$REGION" --quiet --to-latest
              } &
              pids="$pids $!"
            done
            fail=0
            for pid in $pids; do wait "$pid" || fail=1; done
            return $fail
          }
          # Every backend role but api first, so the api never publishes to an older consumer; then the rest.
          consumers=""; for role in $BACKEND_ROLES; do [ "$role" = api ] || consumers="$consumers $role"; done
          others=""; for entry in $OTHER_SERVICES; do others="$others ${entry%%=*}"; done
          # shellcheck disable=SC2086 # the lists are split into words on purpose
          roll $consumers
          # shellcheck disable=SC2086
          roll api $others

      - name: Check the gateway (no LLM, no database writes)
        id: check
        run: |
          KONG_URL=$(gcloud run services describe kong --region "$REGION" --format='value(status.url)')
          FRONTEND_URL=$(gcloud run services describe frontend --region "$REGION" --format='value(status.url)')
          WORKER_URL=$(gcloud run services describe detection-worker --region "$REGION" --format='value(status.url)')
          expect() {  # expect <status> <method> <url> [curl args...]
            want=$1; method=$2; url=$3; shift 3
            got=$(curl -s -o /dev/null -w '%{http_code}' -X "$method" "$url" "$@")
            echo "$method $url -> $got (want $want)"
            [ "$got" = "$want" ]
          }
          # /health, not /healthz: Cloud Run's front end reserves paths ending in "z" and answers them itself.
          expect 200 GET "$KONG_URL/health"
          # Our app's own reply, not any page that happens to answer 200 (Cloud Run's placeholder does).
          curl -s "$KONG_URL/health" | grep -q '"status":"ok"'
          expect 401 GET "$KONG_URL/cases"
          expect 401 GET "$KONG_URL/audit/events"
          expect 404 POST "$KONG_URL/push/doc-worker"
          expect 200 GET "$FRONTEND_URL/"
          # Only Pub/Sub's identity may invoke a worker.
          expect 403 POST "$WORKER_URL/push/detection-worker"
          # api and audit-metrics answer only Kong (its gateway key): called directly, they refuse.
          API_URL=$(gcloud run services describe api --region "$REGION" --format='value(status.url)')
          AUDIT_URL=$(gcloud run services describe audit-metrics --region "$REGION" --format='value(status.url)')
          expect 403 POST "$API_URL/auth/login" -H 'Content-Type: application/json' -d '{"username":"x","password":"x"}'
          expect 403 GET "$AUDIT_URL/metrics"
          expect 200 GET "$API_URL/health"
          # Grafana is up and asks for a login.
          GRAFANA_URL=$(gcloud run services describe grafana --region "$REGION" --format='value(status.url)')
          expect 200 GET "$GRAFANA_URL/api/health"
          expect 401 GET "$GRAFANA_URL/api/dashboards/uid/six-services"
          # The frontend origin passes CORS.
          curl -s -o /dev/null -D - -X OPTIONS "$KONG_URL/cases" -H "Origin: $FRONTEND_URL" \
            -H "Access-Control-Request-Method: GET" | grep -qi "access-control-allow-origin: $FRONTEND_URL"

      - name: Roll back every service
        if: failure()
        run: |
          while read -r svc rev; do
            [ -n "$rev" ] && gcloud run services update-traffic "$svc" --region "$REGION" --to-revisions "$rev=100" --quiet
          done < previous.txt

      - name: Summary
        if: success()
        run: |
          {
            echo "### Deployed $GITHUB_SHA to Cloud Run"
            echo "- Frontend: $(gcloud run services describe frontend --region "$REGION" --format='value(status.url)')"
            echo "- API (Kong): $(gcloud run services describe kong --region "$REGION" --format='value(status.url)')"
            echo "- Grafana: $(gcloud run services describe grafana --region "$REGION" --format='value(status.url)')"
          } >> "$GITHUB_STEP_SUMMARY"

  # GKE (CLOUD_ARCHITECTURE_PLAN.md section 18), beside Cloud Run until phase 6 and only once Terraform has made the
  # cluster (repository variable GKE_ENABLED=true). Signs every image (cosign signature and SBOM, and the Binary
  # Authorization attestation, all with one Cloud KMS key), renders the chart with the images by digest, and hands
  # it to Cloud Deploy, which applies it, records it and runs the gateway checks. A failed rollout is rolled back.
  gke:
    needs: build
    if: vars.GKE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      # cosign's documented form for a Cloud KMS key version.
      KMS_KEY: projects/${{ vars.GCP_PROJECT_ID }}/locations/${{ vars.GCP_REGION || 'asia-southeast1' }}/keyRings/six-sevens/cryptoKeys/image-signing/versions/1
    steps:
      - uses: actions/checkout@v5

      # The token for gcloud and Docker; cosign signs through Cloud KMS with the credentials file. An hour: the
      # rollout is waited for here.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: access_token
          access_token_lifetime: 3600s
          create_credentials_file: true

      # The attestation command is in gcloud's beta component.
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: beta

      - name: Give gcloud the token
        run: echo "CLOUDSDK_AUTH_ACCESS_TOKEN=${{ steps.auth.outputs.access_token }}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # Pinned: a new major version could change the signing flags.
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      # Every push builds new images (each carries its commit), so each is signed afresh; the images are signed in
      # parallel, which takes about as long as the largest one.
      - name: Sign and attest every image
        run: |
          sign() {  # sign <image>: its SBOM, cosign signature and attestation, and the Binary Authorization attestation
            image=$1
            digest=$(gcloud artifacts docker images describe "$REGISTRY/$image:$GITHUB_SHA" --format='value(image_summary.digest)')
            ref="$REGISTRY/$image@$digest"
            # Straight from the registry, not through the runner's Docker (the backend images are large).
            syft scan "registry:$ref" -o spdx-json -q > "sbom-$image.json"
            # No public transparency log: the signatures stay in our registry.
            cosign sign --yes --tlog-upload=false --key "gcpkms://$KMS_KEY" "$ref"
            cosign attest --yes --tlog-upload=false --key "gcpkms://$KMS_KEY" --type spdxjson --predicate "sbom-$image.json" "$ref"
            gcloud beta container binauthz attestations sign-and-create --quiet --artifact-url="$ref" \
              --attestor=built-by-ci --attestor-project="$PROJECT_ID" --keyversion-project="$PROJECT_ID" \
              --keyversion-location="$REGION" --keyversion-keyring=six-sevens --keyversion-key=image-signing --keyversion=1
            echo "$image $ref" > "image-$image.txt"
          }
          pids=""
          for image in $BACKEND_ROLES kong frontend-gke grafana; do
            sign "$image" > "sign-$image.log" 2>&1 &
            pids="$pids $!:$image"
          done
          fail=0
          for entry in $pids; do
            pid=${entry%%:*}; image=${entry#*:}
            if wait "$pid"; then echo "signed $image"; else echo "::error::signing $image failed"; cat "sign-$image.log"; fail=1; fi
          done
          [ "$fail" = 0 ]
          cat image-*.txt > images.txt
          cat images.txt

      - name: Render the release
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: |
          LB=$(gcloud compute addresses describe sixsevens-lb --global --format='value(address)')
          args=()
          while read -r image ref; do
            case "$image" in
              kong) args+=(--set "images.kong=$ref") ;;
              frontend-gke) args+=(--set "images.frontend=$ref") ;;
              grafana) args+=(--set "images.grafana=$ref") ;;
              *) args+=(--set "images.backend.$image=$ref") ;;
            esac
          done < images.txt
          mkdir -p release
          cp deploy/clouddeploy/skaffold.yaml release/
          C=deploy/helm/six-sevens
          helm template six "$C" -f "$C/values-roles.yaml" -f "$C/values-prod.yaml" \
            --set projectId="$PROJECT_ID" --set supabaseUrl="$SUPABASE_URL" --set gateway.address="$LB" \
            "${args[@]}" > release/manifest.yaml
          grep -c '^kind:' release/manifest.yaml

      # A fresh token: signing, the rollout (up to 15 minutes) and verify (up to 15) can outlast the first one.
      - id: auth-release
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: access_token
          access_token_lifetime: 3600s
          create_credentials_file: false

      - name: Give gcloud the new token
        run: echo "CLOUDSDK_AUTH_ACCESS_TOKEN=${{ steps.auth-release.outputs.access_token }}" >> "$GITHUB_ENV"

      - name: Release, and wait for the rollout
        run: |
          # Unique per run, so deploying the same commit twice doesn't clash.
          release="r-${GITHUB_SHA::8}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gcloud deploy releases create "$release" --delivery-pipeline=six-sevens --region="$REGION" \
            --source=release --skaffold-file=skaffold.yaml \
            --gcs-source-staging-dir="gs://$PROJECT_ID-clouddeploy/source" --quiet
          state=""
          for _ in $(seq 1 180); do
            state=$(gcloud deploy rollouts list --release="$release" --delivery-pipeline=six-sevens \
              --region="$REGION" --format='value(state)' | head -1)
            echo "rollout: ${state:-pending}"
            case "$state" in
              SUCCEEDED) echo "### Deployed $GITHUB_SHA to GKE ($release)" >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
              FAILED|CANCELLED|HALTED) break ;;
            esac
            sleep 15
          done
          echo "::error::The GKE rollout of $release did not succeed (${state:-timed out}); rolling back"
          gcloud deploy targets rollback prod --delivery-pipeline=six-sevens --region="$REGION" --quiet \
            || echo "::warning::No earlier release to roll back to"
          exit 1
