server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (CODEBASE_AUDIT 6.8.1). __API_ORIGIN__ and __API_WS_ORIGIN__ are filled in by the
    # Dockerfile from VITE_API_URL (Kong). Supabase signed URLs serve the document previews (iframe, img,
    # and pdf.js's fetch); pdf.js runs in a same-origin worker. Inline styles: React's style attributes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; font-src 'self' data:; connect-src 'self' __API_ORIGIN__ __API_WS_ORIGIN__ https://*.supabase.co; frame-src https://*.supabase.co blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # SPA routing (react-router's BrowserRouter): any path that isn't a real
    # static file falls back to index.html so client-side routing can take
    # over. Without this, reloading on e.g. /login 404s at the nginx level
    # since no such file exists on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
