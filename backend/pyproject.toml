[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fyp-backend"
version = "0.1.0"
description = "FastAPI backend for fyp"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]",
  "sqlalchemy>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "psycopg2-binary>=2.9,<3.0",
  "python-dotenv>=1.0,<2.0",
  "uvicorn[standard]>=0.27,<1.0",
  "supabase>=2.4",
  "pymupdf>=1.24,<2.0",
  "rapidocr>=3.0,<4.0",
  "onnxruntime>=1.20,<2.0",
  "pillow>=10.0,<12.0",
  "reportlab>=4.2,<5.0",
  "pypdf>=4.2,<5.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "httpx2>=2.0,<3.0",
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=5.0,<7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "def __repr__",
  "def __str__",
]
