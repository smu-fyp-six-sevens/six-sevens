app:
  description: 'Regex rule classifier (filename + text). Returns top_candidates: up
    to 3 ranked document-type options, each with confidence (relative share, sums
    to 1 across candidates), match_strength (absolute 0-1 fit), reasoning and evidence.
    Treat as options to weigh, not a final answer.'
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: workflow
  name: rule_classify_v3
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
