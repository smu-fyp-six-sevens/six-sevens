    - data:
        code: "\"\"\"\nllm_classify — Parse & Normalise (Dify Code node after the\
          \ LLM node).\n\nWhy this node exists: LLMs do not reliably return valid\
          \ JSON, distinct\ncategories, or confidences that sum to 1. This node enforces\
          \ the contract\ninstead of trusting the prompt:\n  - strips <think> traces\
          \ / ``` fences, extracts the JSON object\n  - drops categories outside the\
          \ allowed list, dedupes, keeps top 3\n  - match_strength = LLM's absolute\
          \ fit score (0-1), clamped\n  - confidence     = match_strength / sum(match_strength)\
          \ -> sums to 1.0\n  - never raises: parse failure -> top_candidates [] +\
          \ explanatory note\n\nOutput contract matches rule_classify v3 (top_candidates\
          \ + notes).\nAfter editing: Publish, then publish as tool again.\n\"\"\"\
          \n\nimport json\nimport re\n\nTOP_K = 3\nALLOWED_TYPES = {\n    \"bank_statement\"\
          ,\n    \"certificate_of_incorporation\",\n    \"payslip\",\n    \"passport\"\
          ,\n    \"nric\",\n    \"fatca_crs_declaration\",\n    \"certificate_of_incumbency\"\
          ,\n    \"company_constitution\",\n    \"proof_of_address\",\n    \"source_of_wealth\"\
          ,\n    \"credit_report\",\n    \"list_of_loans\",\n    \"notice_of_assessment\"\
          ,\n}\n\n\ndef _extract_json(raw):\n    s = re.sub(r\"<think>.*?</think>\"\
          , \"\", raw or \"\", flags=re.DOTALL).strip()\n    start, end = s.find(\"\
          {\"), s.rfind(\"}\")\n    if start == -1 or end <= start:\n        raise\
          \ ValueError(\"no JSON object found\")\n    return json.loads(s[start:end\
          \ + 1])\n\n\ndef _clamp(value):\n    try:\n        v = float(value)\n  \
          \  except (TypeError, ValueError):\n        return 0.0\n    return max(0.0,\
          \ min(1.0, v))\n\n\ndef _as_str_list(value):\n    if value is None:\n  \
          \      return []\n    if isinstance(value, str):\n        return [value]\n\
          \    if isinstance(value, list):\n        return [str(v) for v in value\
          \ if v is not None]\n    return [str(value)]\n\n\ndef _normalise(candidates):\n\
          \    if not candidates:\n        return candidates\n    total = sum(c[\"\
          match_strength\"] for c in candidates)\n    if total > 0:\n        shares\
          \ = [c[\"match_strength\"] / total for c in candidates]\n    else:\n   \
          \     shares = [1.0 / len(candidates)] * len(candidates)\n    rounded =\
          \ [round(s, 4) for s in shares]\n    rounded[0] = round(rounded[0] + (1.0\
          \ - sum(rounded)), 4)  # absorb rounding drift\n    out = []\n    for i,\
          \ (c, conf) in enumerate(zip(candidates, rounded)):\n        out.append({\n\
          \            \"rank\": i + 1,\n            \"document_type\": c[\"document_type\"\
          ],\n            \"confidence\": conf,\n            \"match_strength\": round(c[\"\
          match_strength\"], 4),\n            \"reasoning\": c[\"reasoning\"],\n \
          \           \"evidence\": c[\"evidence\"],\n        })\n    return out\n\
          \n\ndef main(llm_text: str) -> dict:\n    notes = [\"vision noa added version\"\
          ]\n    raw_text = llm_text or \"\"\n\n    if raw_text.strip().startswith(\"\
          LLM call tool failed\"):\n        return {\"top_candidates\": [], \"notes\"\
          : [\"LLM call failed; no classification produced.\"]}\n\n    try:\n    \
          \    data = _extract_json(raw_text)\n    except Exception as exc:\n    \
          \    return {\"top_candidates\": [], \"notes\": [f\"LLM output could not\
          \ be parsed as JSON ({exc}).\"]}\n\n    raw_candidates = data.get(\"top_candidates\"\
          ) if isinstance(data, dict) else None\n    if raw_candidates is None and\
          \ isinstance(data, dict) and \"document_type\" in data:\n        raw_candidates\
          \ = [data]  # tolerate the old single-answer shape\n        notes.append(\"\
          LLM returned a single answer instead of 3 candidates.\")\n    if not isinstance(raw_candidates,\
          \ list):\n        raw_candidates = []\n\n    seen, candidates = set(), []\n\
          \    for c in raw_candidates:\n        if not isinstance(c, dict):\n   \
          \         continue\n        doc_type = str(c.get(\"document_type\") or \"\
          \").strip().lower()\n        if doc_type not in ALLOWED_TYPES:\n       \
          \     if doc_type and doc_type != \"null\":\n                notes.append(f\"\
          Dropped unknown category '{doc_type}' returned by the LLM.\")\n        \
          \    continue\n        if doc_type in seen:\n            continue\n    \
          \    seen.add(doc_type)\n        candidates.append({\n            \"document_type\"\
          : doc_type,\n            \"match_strength\": _clamp(c.get(\"match_strength\"\
          , c.get(\"confidence\", 0))),\n            \"reasoning\": str(c.get(\"reasoning\"\
          ) or \"\"),\n            \"evidence\": _as_str_list(c.get(\"evidence\")),\n\
          \        })\n\n    # Stable sort keeps the LLM's own order for ties.\n \
          \   candidates.sort(key=lambda c: -c[\"match_strength\"])\n    top = _normalise(candidates[:TOP_K])\n\
          \n    if not top:\n        notes.append(\"LLM returned no valid candidates.\"\
          )\n    elif len(top) < TOP_K:\n        notes.append(f\"Only {len(top)} valid\
          \ candidate(s) returned.\")\n    if top and sum(c[\"match_strength\"] for\
          \ c in top) == 0:\n        notes.append(\"LLM gave zero match_strength to\
          \ every candidate; confidence split evenly — treat as unclassified.\")\n\
          \n    return {\"top_candidates\": top, \"notes\": notes}\n"
        code_language: python3
        outputs:
          notes:
            children: null
            type: array[string]
          top_candidates:
            children: null
            type: array[object]
