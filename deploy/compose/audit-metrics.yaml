services:
  audit-metrics:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: audit-metrics
    image: six-sevens/audit-metrics:local
    env_file:
      - path: ../../backend/.env
        required: false
    environment:
      EVENT_TRANSPORT: pubsub
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GOOGLE_CLOUD_PROJECT: local
      CORS_IN_APP: "false"
    depends_on:
      pubsub-init:
        condition: service_completed_successfully
