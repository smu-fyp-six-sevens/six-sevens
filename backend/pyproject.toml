[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fyp-backend"
version = "0.1.0"
description = "FastAPI backend for fyp"
requires-python = ">=3.11"
# Runtime dependencies live in requirements.txt, the one list both `pip
# install -e .` and the Docker build read from — no more keeping two
# dependency lists in sync by hand.
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
  # httpx2 is required for CI, not imported directly — see git history for
  # the error it works around.
  "httpx2>=2.0,<3.0",
  "pyright==1.1.414",
  "ruff>=0.6",
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=5.0,<7.0",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Puts backend/ on sys.path so tests can import `app` and `scripts` whichever
# way pytest is launched (plain `pytest` in CI, `python -m pytest`, an IDE).
pythonpath = ["."]
# Regression suite tags (SCRUM-206, SCRUM-246): `pytest -m sprint1`, `-m sprint2`, `-m sprint3`.
# story(...) records the Jira story and the sprint test sheet's test case ID.
markers = [
  "sprint1: regression test for a Sprint 1 test case",
  "sprint2: regression test for a Sprint 2 test case",
  "sprint3: regression test for a Sprint 3 test case",
  "story(jira_id, test_case_id): the Jira story and manual test case ID this test covers",
]
filterwarnings = [
  # langgraph-checkpoint's own internal import (JsonPlusSerializer) trips a
  # pending-deprecation warning about an `allowed_objects` default we never
  # pass ourselves — nothing in this codebase calls it, so there's no source
  # fix, only this filter. Revisit once Phase 4's checkpointer is actually
  # wired in (see LANGGRAPH_MIGRATION_PLAN.md).
  "ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
]

[tool.setuptools.packages.find]
include = ["app*"]

# CI runs `pyright` from backend/ and fails on any error. Only app/ is checked. Suppressions are not
# allowed: `# type: ignore` comments are not honoured, and CI rejects `# pyright:` comments and any
# rule overrides in this section. Fix the type instead.
[tool.pyright]
include = ["app"]
typeCheckingMode = "standard"
enableTypeIgnoreComments = false

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# The classic set (pycodestyle errors that matter, pyflakes) plus blanket type-ignore comments.
select = ["E4", "E7", "E9", "F", "PGH003", "PGH004"]

[tool.coverage.run]
omit = [
  # Dev-only synthetic fraud-injection tool, deliberately not unit-tested
  # (see tests/conftest.py's collect_ignore) — omit so it doesn't show as a
  # 0% coverage gap.
  "app/injection/*",
  "app/routers/injection.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "def __repr__",
  "def __str__",
]
