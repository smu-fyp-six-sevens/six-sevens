# One Prometheus data source for every dashboard. On Cloud Run it is Google's query proxy (a sidecar signing
# requests as Grafana's service account) in front of Managed Prometheus, which also answers PromQL for Cloud
# Monitoring metrics (Cloud Run, Pub/Sub). Locally it is the Prometheus in the observability profile.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: ${PROMETHEUS_URL}
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s
      httpMethod: GET

  # Billed cost from the Cloud Billing export (deploy/terraform/billing.tf), as Grafana's service account
  # through the metadata server. Locally it has no credentials, so the "Billed" panels show an error.
  - name: BigQuery
    uid: bigquery
    type: grafana-bigquery-datasource
    editable: false
    jsonData:
      authenticationType: gce
      defaultProject: ${GCP_PROJECT}
      processingLocation: ${BIGQUERY_LOCATION}
