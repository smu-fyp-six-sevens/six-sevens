    - data:
        code: "import json\n\n# Document types the Classifier may emit. passport/nric\
          \ are real types;\n# \"id_document\" is deliberately NOT here — it's only\
          \ a checklist slot (see\n# REQUIREMENT_FOR_TYPE below), never a document's\
          \ own type.\nVALID_TYPES = {\n    \"bank_statement\", \"certificate_of_incorporation\"\
          , \"payslip\",\n    \"passport\", \"nric\", \"fatca_crs_declaration\", \"\
          certificate_of_incumbency\",\n    \"company_constitution\", \"proof_of_address\"\
          , \"source_of_wealth\",\n    \"credit_report\", \"list_of_loans\", \"notice_of_assessment\"\
          , \"unrecognised\"\n}\n\n# The prompt's \"no match\" answer is \"other\"\
          ; the backend's sentinel for the\n# same thing is \"unrecognised\".\nTYPE_ALIASES\
          \ = {\"other\": \"unrecognised\"}\n\n# passport and nric both fill the single\
          \ id_document checklist slot; every\n# other type is its own requirement.\n\
          REQUIREMENT_FOR_TYPE = {\"passport\": \"id_document\", \"nric\": \"id_document\"\
          }\n\n# Fulfilled requirements are checklist items, not document_type guesses\
          \ —\n# \"unrecognised\" is a sentinel for \"couldn't classify\" and is never\
          \ itself\n# a real requirement. passport/nric aren't requirements either\
          \ (they map to\n# id_document above), while id_document is a requirement\
          \ but not a type.\nVALID_REQUIREMENTS = (VALID_TYPES - {\"unrecognised\"\
          , \"passport\", \"nric\"}) | {\"id_document\"}\n\ndef main(agent_output:\
          \ str, convo_id: str) -> dict:\n    doc_type, confidence, evidence, reasoning\
          \ = \"\", 0.0, [], \"\"\n    fulfilled_requirements = []\n    flagged =\
          \ True\n\n    try:\n        raw = agent_output or \"\"\n        parsed =\
          \ json.loads(raw[raw.find(\"{\"): raw.rfind(\"}\") + 1])\n        candidate\
          \ = (parsed.get(\"document_type\") or \"\").strip().lower()\n        candidate\
          \ = TYPE_ALIASES.get(candidate, candidate)\n        doc_type = candidate\
          \ if candidate in VALID_TYPES else \"\"\n        confidence = max(0.0, min(1.0,\
          \ float(parsed.get(\"confidence\", 0.0))))\n        evidence = [str(item)\
          \ for item in parsed.get(\"evidence\", [])]\n        reasoning = str(parsed.get(\"\
          reasoning\", \"\"))\n        flagged = bool(parsed.get(\"needs_manual_review\"\
          , True))\n\n        raw_requirements = parsed.get(\"fulfilled_requirements\"\
          , [])\n        if isinstance(raw_requirements, list):\n            fulfilled_requirements\
          \ = [\n                str(item) for item in raw_requirements if str(item)\
          \ in VALID_REQUIREMENTS\n            ]\n\n        # Self-fulfilment fallback\
          \ — mirrors the backend's own fallback for\n        # when this section\
          \ is missing entirely: a document always at least\n        # satisfies its\
          \ own primary type (passport/nric via id_document),\n        # even if the\
          \ agent didn't say so explicitly.\n        own_requirement = REQUIREMENT_FOR_TYPE.get(doc_type,\
          \ doc_type)\n        if not fulfilled_requirements and own_requirement in\
          \ VALID_REQUIREMENTS:\n            fulfilled_requirements = [own_requirement]\n\
          \n        if candidate and not doc_type:\n            reasoning = f\"Agent\
          \ returned unknown type '{candidate}'. {reasoning}\"\n            flagged\
          \ = True\n    except (ValueError, TypeError, AttributeError):\n        reasoning\
          \ = \"Could not parse agent output as JSON.\"\n\n    evidence_markdown =\
          \ \"\\n\".join(f\"- {item}\" for item in evidence) if evidence else \"-\
          \ (none)\"\n    fulfilled_requirements_markdown = (\n        \"\\n\".join(f\"\
          - {item}\" for item in fulfilled_requirements)\n        if fulfilled_requirements\n\
          \        else \"- (none)\"\n    )\n\n    output =  {\n        \"document_type\"\
          : doc_type,\n        \"confidence\": round(confidence, 4),\n        \"evidence\"\
          : evidence,\n        \"evidence_markdown\": evidence_markdown,\n       \
          \ \"fulfilled_requirements\": fulfilled_requirements,\n        \"fulfilled_requirements_md\"\
          : fulfilled_requirements_markdown,\n        \"needs_manual_review\": flagged\
          \ or not doc_type,\n        \"reasoning\": reasoning,\n        \"convo_id\"\
          : convo_id\n    }\n    return {\"output\": json.dumps(output)}\n"
        code_language: python3
        outputs:
          output:
            children: null
            type: string
